<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI伴读开麦 · 小王子版倒计时微调</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f5f9;padding:32px 16px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:24px;color:#1a202c;margin-bottom:6px}
.lead{font-size:14px;color:#5b6676;margin-bottom:20px}
.device{background:#fff;border:1px solid #e6ebf2;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:18px;overflow:hidden;margin-top:18px}
.device-inner{border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(180deg,#f7fafd,#f1f5fc)}
.device-top{padding:14px 16px 10px;background:linear-gradient(180deg,#fff,#fafbfd);border-bottom:1px solid #eff3fa;display:flex;justify-content:space-between;align-items:center}
.device-top .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:#7a869a;font-weight:600}
.device-top .meta span{background:#f3f5f9;padding:3px 9px;border-radius:10px}
.device-screen{padding:20px 16px 26px;position:relative;min-height:460px;display:flex;flex-direction:column;justify-content:space-between}
.character{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:150px;opacity:.12;pointer-events:none}
.top-area{display:flex;gap:12px;align-items:flex-start}
.ai-bubble{background:#fff;border:1px solid #e6ebf2;border-radius:18px 18px 18px 8px;padding:12px 16px;max-width:78%;box-shadow:0 2px 14px rgba(0,0,0,.06);opacity:0;transform:translateY(6px);transition:all .35s ease;position:relative}
.ai-bubble.show{opacity:1;transform:none}
.ai-bubble .ai-name{font-size:12px;color:#5b6ef5;font-weight:800;margin-bottom:4px}
.ai-bubble .ai-text{font-size:15px;color:#1a202c;font-weight:700;line-height:1.5}
.bottom-zone{margin-top:auto;display:flex;justify-content:flex-end;align-items:flex-end;gap:16px}
.countdown-zone{opacity:0;transform:translateY(8px);transition:all .4s ease}
.countdown-zone.show{opacity:1;transform:none}
.countdown-circle{width:58px;height:58px;border-radius:50%;background:#f0f3ff;border:3px solid #5b6ef5;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#5b6ef5;font-family:ui-monospace,"SF Mono",monospace;line-height:1}
.countdown-done{width:140px;height:40px;border-radius:20px;background:#2fb37a;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(47,179,122,.25)}
.student-zone{display:flex;flex-direction:column;align-items:center;gap:10px}
.student-card{width:130px;height:130px;border-radius:22px;background:#fff;border:2px solid #e6ebf2;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.08);overflow:hidden;position:relative}
.student-avatar{width:110px;height:110px;border-radius:18px;background:linear-gradient(180deg,#eaf4ff,#d9ecff);display:flex;align-items:center;justify-content:center;font-size:70px}
.student-mic{position:absolute;bottom:8px;right:8px;width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid #e6ebf2;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn-row{display:flex;gap:12px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:14px;font-size:14px;font-weight:800;padding:11px 22px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-play{background:#5b6ef5;color:#fff;box-shadow:0 4px 14px rgba(91,110,245,.35)}
.btn-play:hover{background:#4a5ce0}
.btn-reset{background:#f3f5f9;color:#1a202c;border:1px solid #e6ebf2}
.ctl-panel{background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:16px 18px;margin-top:18px;box-shadow:0 3px 14px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ctl h3{font-size:12px;color:#7a869a;margin-bottom:8px;font-weight:700}
.ctl select,.ctl input[type=range]{width:100%;padding:8px 10px;border:1px solid #e6ebf2;border-radius:10px;background:#fafbfd;font-size:14px;font-family:inherit;color:#1a202c}
.ctl-row{display:flex;align-items:center;gap:10px}
.ctl-row span{font-weight:800;color:#5b6ef5;min-width:40px;font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",monospace}
.note{background:#e8f8ef;border:1px solid #cdf0dd;border-radius:14px;padding:12px 16px;margin-top:16px;font-size:13px;color:#2a7a51;line-height:1.6}
.note b{color:#1a7a4a}
.version{position:fixed;top:16px;right:16px;background:#5b6ef5;color:#fff;font-size:12px;font-weight:800;padding:5px 12px;border-radius:16px;box-shadow:0 3px 10px rgba(91,110,245,.35);font-family:-apple-system,sans-serif}
@media(max-width:860px){.comparison{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>AI伴读开麦 · 小王子版倒计时微调</h1>
<p class="lead">不需要等待的题目: 和现状完全一致 | 需要等待的题目: 只显示倒计时圆圈</p>

<div class="device">
  <div class="device-inner">
    <div class="device-top">
      <div class="meta">
        <span>小王子</span><span>第5课</span><span>小问2</span>
      </div>
      <div class="meta">
        <span id="waitTag" style="background:#fff6e6;color:#b9770f">需要等待=是</span>
      </div>
    </div>
    <div class="device-screen">
      <div class="character">🤴</div>
      <div class="top-area">
        <div class="ai-bubble" id="aiBubble">
          <div class="ai-name">AI小猿老师</div>
          <div class="ai-text" id="aiText">你猜猜小王子后面干什么了?</div>
        </div>
      </div>
      <div class="bottom-zone">
        <div class="countdown-zone" id="countdownZone">
          <div class="countdown-circle" id="countdownCircle">5</div>
        </div>
        <div class="student-zone">
          <div class="student-card">
            <div class="student-avatar">👦</div>
            <div class="student-mic">🎙️</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="btn-row">
  <button class="btn btn-play" id="btnPlay">▶ 播放</button>
  <button class="btn btn-reset" id="btnReset">↺ 重置</button>
</div>

<div class="ctl-panel">
  <div class="ctl">
    <h3>题目类型</h3>
    <select id="questionType">
      <option value="wait">需要等待=是</option>
      <option value="nowait">需要等待=否</option>
    </select>
  </div>
  <div class="ctl">
    <h3>倒计时秒数</h3>
    <div class="ctl-row">
      <input type="range" id="secSlider" min="2" max="15" value="5">
      <span id="secVal">5s</span>
    </div>
  </div>
</div>

<div class="note">
  <b>完全按你的要求调整:</b>不需要等待的题目和现状一致; 需要等待的题目只在原灯的位置显示倒计时圆圈,无提示文字,无呼吸灯。
</div>
</div>

<div class="version">v5 · 无灯纯倒计时</div>

<script>
const $=id=>document.getElementById(id);
let run=0, interrupt=false;

function updateTag(){
  const t=$('questionType').value;
  const tag=$('waitTag');
  if(t==='wait'){
    tag.style.background='#fff6e6';tag.style.color='#b9770f';tag.textContent='需要等待=是';
  }else{
    tag.style.background='#eef1f8';tag.style.color='#5b6676';tag.textContent='需要等待=否';
  }
}

$('questionType').addEventListener('change',updateTag);
$('secSlider').addEventListener('input',e=>$('secVal').textContent=e.target.value+'s');
updateTag();

async function playFlow(){
  const myRun=++run; interrupt=false;
  resetState();
  const type=$('questionType').value;
  const secs=+$('secSlider').value;
  const isCancel=()=>run!==myRun;
  const wait=(ms)=>new Promise(r=>{const end=Date.now()+ms;(function t(){if(interrupt||isCancel())return r();if(Date.now()>=end)return r();setTimeout(t,40);})();});

  // ① AI说话
  $('aiBubble').classList.add('show');
  await wait(1800);if(isCancel())return;

  // ② 分支: 等待或不等待
  if(type==='wait'){
    // 需要等待: 显示倒计时圆圈
    $('countdownZone').classList.add('show');
    $('countdownCircle').textContent=secs;
    $('countdownCircle').className='countdown-circle';
    let started=Date.now();
    while(true){
      if(isCancel())return;
      const left=Date.now()-started;
      const leftSec=Math.max(0,Math.ceil((1000*secs-left)/1000));
      $('countdownCircle').textContent=leftSec;
      if(interrupt)break;
      if(left>=1000*secs)break;
      await wait(100);
    }
    if(isCancel())return;
    if(interrupt){interrupt=false;gotoDone();}
  }

  // ③ 完成
  gotoDone();

  async function gotoDone(){
    $('countdownZone').classList.remove('show');
    const el=document.getElementById('countdownCircle');
    el.outerHTML='<div class="countdown-done" id="countdownCircle">完成 ✓</div>';
    await wait(2000);if(isCancel())return;
    document.getElementById('countdownCircle').outerHTML='<div class="countdown-circle" id="countdownCircle">5</div>';
  }
}

function resetState(){
  $('aiBubble').classList.remove('show');
  $('countdownZone').classList.remove('show');
  document.getElementById('countdownCircle').outerHTML='<div class="countdown-circle" id="countdownCircle">'+$('secSlider').value+'</div>';
}

$('btnPlay').addEventListener('click',()=>{if(!$('btnPlay').disabled)playFlow();});
$('btnReset').addEventListener('click',()=>{run++;resetState();});
document.addEventListener('keydown',e=>{if(e.key===' ')interrupt=true;});
</script>
</body>
</html>
