<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI伴读开麦 · 小王子版倒计时微调</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f5f9;padding:32px 16px}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:24px;color:#1a202c;margin-bottom:6px}
.lead{font-size:14px;color:#5b6676;margin-bottom:20px}
.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:10px}
.panel{background:#fff;border:1px solid #e6ebf2;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);padding:18px;overflow:hidden}
.panel h2{font-size:16px;color:#1a202c;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:700}
.badge.now{background:#eef1f8;color:#5b6676}
.badge.new{background:#e8f8ef;color:#2fb37a}
.device{border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(180deg,#f7fafd,#f1f5fc)}
.device-top{padding:14px 16px 10px;background:linear-gradient(180deg,#fff,#fafbfd);border-bottom:1px solid #eff3fa;display:flex;justify-content:space-between;align-items:center}
.device-top .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:#7a869a;font-weight:600}
.device-top .meta span{background:#f3f5f9;padding:3px 9px;border-radius:10px}
.device-screen{padding:20px 16px 26px;position:relative;min-height:460px;display:flex;flex-direction:column;justify-content:space-between}
.character{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:150px;opacity:.12;pointer-events:none}
.ai-bubble{background:#fff;border:1px solid #e6ebf2;border-radius:18px 18px 18px 8px;padding:12px 16px;max-width:85%;box-shadow:0 2px 14px rgba(0,0,0,.06);opacity:0;transform:translateY(6px);transition:all .35s ease;position:relative}
.ai-bubble.show{opacity:1;transform:none}
.ai-bubble .ai-name{font-size:12px;color:#5b6ef5;font-weight:800;margin-bottom:4px}
.ai-bubble .ai-text{font-size:15px;color:#1a202c;font-weight:700;line-height:1.5}
.bottom-zone{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.countdown-zone{text-align:center;opacity:0;transform:translateY(8px);transition:all .4s ease}
.countdown-zone.show{opacity:1;transform:none}
.countdown-clock{width:90px;height:90px;border-radius:50%;background:#fff;border:4px solid #5b6ef5;box-shadow:0 4px 18px rgba(91,110,245,.25);display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.countdown-num{font-size:42px;font-weight:800;color:#5b6ef5;font-family:ui-monospace,"SF Mono",monospace;line-height:1}
.countdown-hint{font-size:13px;color:#5b6676;background:#eef1fe;padding:6px 14px;border-radius:14px;display:inline-block;font-weight:700}
.student-zone{display:flex;flex-direction:column;align-items:center;gap:8px}
.student-card{width:130px;height:130px;border-radius:22px;background:#fff;border:2px solid #e6ebf2;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(0,0,0,.08);overflow:hidden;position:relative}
.student-avatar{width:110px;height:110px;border-radius:18px;background:linear-gradient(180deg,#eaf4ff,#d9ecff);display:flex;align-items:center;justify-content:center;font-size:70px}
.student-mic{position:absolute;bottom:8px;right:8px;width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid #e6ebf2;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.light-label{font-size:12px;color:#7a869a;font-weight:700;background:#f3f5f9;padding:4px 12px;border-radius:12px;margin-bottom:6px}
.light{width:130px;height:26px;border-radius:16px;background:linear-gradient(90deg,#cdd2de,#b9bfcd,#cdd2de);display:flex;align-items:center;justify-content:center;gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.08);opacity:0;transition:all .35s ease;animation:none}
.light.show{opacity:1}
.light.waiting{animation:dimBreathe 2.4s ease-in-out infinite}
.light.listening{background:linear-gradient(90deg,#8fa5f8,#5b6ef5,#8fa5f8);animation:recBreathe 1.4s ease-in-out infinite;box-shadow:0 2px 14px rgba(91,110,245,.35)}
.light.done{background:linear-gradient(90deg,#6bd5a5,#2fb37a,#6bd5a5);box-shadow:0 2px 12px rgba(47,179,122,.25)}
@keyframes dimBreathe{0%,100%{transform:scaleY(.95)}50%{transform:scaleY(1.02)}}
@keyframes recBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.light .ph{width:0;height:14px;border-radius:6px;background:#fff;opacity:0;transition:all .2s}
.light.speaking .ph{width:11px;opacity:.95}
.btn-row{display:flex;gap:12px;margin-top:20px;justify-content:center;flex-wrap:wrap}
.btn{border:none;border-radius:14px;font-size:14px;font-weight:800;padding:11px 22px;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-play{background:#5b6ef5;color:#fff;box-shadow:0 4px 14px rgba(91,110,245,.35)}
.btn-play:hover{background:#4a5ce0}
.btn-speak{background:#2fb37a;color:#fff;box-shadow:0 4px 14px rgba(47,179,122,.35)}
.btn-speak:hover{background:#269a64}
.btn-reset{background:#f3f5f9;color:#1a202c;border:1px solid #e6ebf2}
.ctl-panel{background:#fff;border:1px solid #e6ebf2;border-radius:16px;padding:16px 18px;margin-top:18px;box-shadow:0 3px 14px rgba(0,0,0,.06);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ctl h3{font-size:12px;color:#7a869a;margin-bottom:8px;font-weight:700}
.ctl select,.ctl input[type=range]{width:100%;padding:8px 10px;border:1px solid #e6ebf2;border-radius:10px;background:#fafbfd;font-size:14px;font-family:inherit;color:#1a202c}
.ctl-row{display:flex;align-items:center;gap:10px}
.ctl-row span{font-weight:800;color:#5b6ef5;min-width:40px;font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",monospace}
.note{background:#e8f8ef;border:1px solid #cdf0dd;border-radius:14px;padding:12px 16px;margin-top:16px;font-size:13px;color:#2a7a51;line-height:1.6}
.note b{color:#1a7a4a}
.version{position:fixed;top:16px;right:16px;background:#5b6ef5;color:#fff;font-size:12px;font-weight:800;padding:5px 12px;border-radius:16px;box-shadow:0 3px 10px rgba(91,110,245,.35);font-family:-apple-system,sans-serif}
@media(max-width:860px){.comparison{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>AI伴读开麦 · 小王子版倒计时微调</h1>
<p class="lead">左侧=现状(A说完立刻显示"等待等待") · 右侧=微调方案(A说完→倒计时5秒+提示→再显示聆听)</p>

<div class="comparison">
  <div class="panel">
    <h2><span class="badge now">现状</span>AI说完立刻开麦</h2>
    <div class="device">
      <div class="device-top">
        <div class="meta">
          <span>小王子</span><span>第5课</span><span>小问2</span>
        </div>
        <div class="meta">
          <span style="background:#fff6e6;color:#b9770f">需要等待=否</span>
        </div>
      </div>
      <div class="device-screen" id="screenNow">
        <div class="character">🤴</div>
        <div class="ai-bubble" id="aiNow">
          <div class="ai-name">AI小猿老师</div>
          <div class="ai-text" id="aiTextNow">你猜猜小王子后面干什么了?</div>
        </div>
        <div class="bottom-zone">
          <div style="width:50%"></div>
          <div class="student-zone">
            <div class="light-label" id="lblNow">准备就绪</div>
            <div class="light" id="lightNow">
              <span class="ph"></span><span class="ph"></span><span class="ph"></span>
            </div>
            <div class="student-card">
              <div class="student-avatar">👦</div>
              <div class="student-mic">🎙️</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2><span class="badge new">微调方案</span>加5秒思考倒计时</h2>
    <div class="device">
      <div class="device-top">
        <div class="meta">
          <span>小王子</span><span>第5课</span><span>小问2</span>
        </div>
        <div class="meta">
          <span style="background:#eef1fe;color:#5b6ef5">需要等待=是</span>
        </div>
      </div>
      <div class="device-screen" id="screenNew">
        <div class="character">🤴</div>
        <div class="ai-bubble" id="aiNew">
          <div class="ai-name">AI小猿老师</div>
          <div class="ai-text" id="aiTextNew">你猜猜小王子后面干什么了?</div>
        </div>
        <div class="bottom-zone">
          <div class="countdown-zone" id="cdZone">
            <div class="countdown-clock"><div class="countdown-num" id="cdNum">5</div></div>
            <div class="countdown-hint" id="cdHint">不着急，你慢慢说哦</div>
          </div>
          <div class="student-zone">
            <div class="light-label" id="lblNew">准备就绪</div>
            <div class="light" id="lightNew">
              <span class="ph"></span><span class="ph"></span><span class="ph"></span>
            </div>
            <div class="student-card">
              <div class="student-avatar">👦</div>
              <div class="student-mic">🎙️</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="btn-row">
  <button class="btn btn-play" id="btnPlay">▶ 同时播放两条对比</button>
  <button class="btn btn-reset" id="btnReset">↺ 重置</button>
</div>

<div class="ctl-panel">
  <div class="ctl">
    <h3>倒计时秒数</h3>
    <div class="ctl-row">
      <input type="range" id="secSlider" min="2" max="15" value="5">
      <span id="secVal">5s</span>
    </div>
  </div>
  <div class="ctl">
    <h3>提示话术</h3>
    <select id="hintSel">
      <option value="0">不着急，你慢慢说哦</option>
      <option value="1">先打个草稿，想好了再说</option>
      <option value="2">慢慢想，老师会等你</option>
      <option value="3">先在脑子里过一遍再开口</option>
    </select>
  </div>
</div>

<div class="note">
  <b>红线:</b>倒计时期间麦克风其实是开着的——学生提前想好了随时可以开口打断倒计时,立刻进入聆听状态,绝不拖慢节奏。
</div>
</div>

<div class="version">v3 · 小王子版</div>

<script>
const $=id=>document.getElementById(id);
let run=0, interrupt=false;
const HINTS=["不着急，你慢慢说哦","先打个草稿，想好了再说","慢慢想，老师会等你","先在脑子里过一遍再开口"];

$('secSlider').addEventListener('input',e=>$('secVal').textContent=e.target.value+'s');
$('hintSel').addEventListener('change',e=>$('cdHint').textContent=HINTS[e.target.value]);

async function playBoth(){
  const myRun=++run; interrupt=false;
  resetBoth();
  const secs=+$('secSlider').value;
  const aiNow=$('aiNow'),aiNew=$('aiNew');
  const lightNow=$('lightNow'),lightNew=$('lightNew');
  const lblNow=$('lblNow'),lblNew=$('lblNew');
  const cdZone=$('cdZone'),cdNum=$('cdNum');
  const isCancel=()=>run!==myRun;
  const wait=(ms)=>new Promise(r=>{const end=Date.now()+ms;(function t(){if(interrupt||isCancel())return r();if(Date.now()>=end)return r();setTimeout(t,40);})();});

  // ① AI说话两边同时开始
  aiNow.classList.add('show');aiNew.classList.add('show');
  lblNow.textContent='AI正在说…';lblNew.textContent='AI正在说…';
  await wait(1800);if(isCancel())return;

  // ② 现状:立刻显示等待呼吸灯; 新方案:显示倒计时
  lblNow.textContent='等待等待';lightNow.classList.add('show','waiting');
  lblNew.textContent='思考中…';cdZone.classList.add('show');
  let started=Date.now();
  while(true){
    if(isCancel())return;
    const left=Date.now()-started;
    const leftSec=Math.max(0,Math.ceil((1000*secs-left)/1000));
    cdNum.textContent=leftSec;
    if(interrupt)break;
    if(left>=1000*secs)break;
    await wait(100);
  }
  if(isCancel())return;
  if(interrupt){interrupt=false;gotoListenBoth();}

  // ③ 两边都进入聆听
  gotoListenBoth();

  async function gotoListenBoth(){
    cdZone.classList.remove('show');
    lblNow.textContent='开始聆听';lblNew.textContent='开始聆听';
    lightNow.classList.remove('waiting');lightNow.classList.add('listening');
    lightNew.classList.add('show','listening');
    await wait(2600);if(isCancel())return;

    // 模拟学生开口
    lblNow.textContent='你在说话…';lblNew.textContent='你在说话…';
    lightNow.classList.remove('listening');lightNow.classList.add('speaking');
    lightNew.classList.remove('listening');lightNew.classList.add('speaking');
    await wait(1200);if(isCancel())return;

    // 完成
    lightNow.classList.remove('speaking');lightNow.classList.add('done');
    lightNew.classList.remove('speaking');lightNew.classList.add('done');
    lblNow.textContent='完成 ✓';lblNew.textContent='完成 ✓';
  }
}
function resetBoth(){
  $('aiNow').classList.remove('show');$('aiNew').classList.remove('show');
  $('cdZone').classList.remove('show');
  const lightNow=$('lightNow'),lightNew=$('lightNew');
  lightNow.className='light';lightNew.className='light';
  lightNow.classList.remove('show');
  lightNew.classList.remove('show');
  $('lblNow').textContent='准备就绪';
  $('lblNew').textContent='准备就绪';
}

$('btnPlay').addEventListener('click',()=>{if(!$('btnPlay').disabled)playBoth();});
$('btnReset').addEventListener('click',()=>{run++;resetBoth();});

// 模拟学生提前开口打断
document.addEventListener('keydown',e=>{if(e.key===' ')interrupt=true;});
</script>
</body>
</html>
