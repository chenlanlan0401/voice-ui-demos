<body>
<div class="topbar">
  <h1>语音噪声基线标注 · 随机100条</h1>
  <p>数据:AI大阅读课 · 8.31-9.6全天随机 · 有人声 · 时长&gt;3秒 · 首句为AI问题 · 带AI问答</p>
  <p>用途:听音频标真值(是否有噪声),得出无偏基线占比。橙标是我的文本预判(仅参考,以你听到的为准)</p>
</div>
<main>
  <section class="summary">
    <div class="metrics">
      <div class="metric"><span>总样本</span><strong id="m-total">0</strong><em>随机100条</em></div>
      <div class="metric"><span>已标</span><strong id="m-done">0</strong></div>
      <div class="metric"><span>有噪声</span><strong id="m-noise">0</strong><em>你判定的真值</em></div>
      <div class="metric"><span>噪声占比</span><strong id="m-rate">—</strong><em>=有噪声/已标(基线)</em></div>
      <div class="metric"><span>影响回复</span><strong id="m-affect">0</strong></div>
    </div>
  </section>
  <section class="guide">
    <b>噪声定义:</b> 音频里出现<b>学生本人以外的声音</b>就是噪声。两类:①只有别人声音(非学生) ②学生和别人声音都有。<br>
    <b>判不出说话人时:</b> 点开"回看上文",听前几轮学生的音频,比对是不是同一个人的声音。
  </section>
  <section class="toolbar">
    <label>筛选 <select id="f-status"><option value="">全部</option><option value="undone">未标</option><option value="done">已标</option><option value="noise">有噪声</option><option value="prey">我预判有噪声</option></select></label>
    <span class="spacer"></span>
    <button id="btn-json" class="primary">导出JSON</button>
    <button id="btn-csv">导出CSV</button>
  </section>
  <section id="case-list"></section>
</main>

or-student-speaking.fbcontent.cn/speech/ai-reading/860562503128752139/1788511697055.aac", "duration_s": 60, "created_at": "2026-09-04 16:49:23", "prelabel": "疑似有噪声", "prelabel_reason": "多人吃东西闲聊\"快吃送给你哥哥\"\"传说中的炖粥\",全程跑飞,疑似现场多人"}, {"idx": 5, "target_id": "861297950305939459", "userid": "573942918", "chatid": "861297563083608073", "textid": 5, "ai_question": "你已经摸到了文章批判的核心方向，能不能结合小鲁迅从“笑着跳着”盼赛会，到后来觉得没什么大意思的心情变化，说说鲁迅要反对怎样的教育方式呢？", "student_asr": "要反对这种，呃，把丢弃孩子说成孝的这种行为。", "ai_answer": "你刚才提到的把丢弃孩子说成孝的内容，是之前《二十四孝图》里的批判，《五猖会》里鲁迅真正要写的，是批判这种不顾儿童心理、用命令强迫孩子死记硬背的专制封建教育。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861297563083608073/1788686997534.aac", "duration_s": 30, "created_at": "2026-09-06 17:30:33", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 6, "target_id": "861355860100702265", "userid": "324028646", "chatid": "861355554545868849", "textid": 5, "ai_question": "你说的方向对，他一闭眼就看见自己顷刻间变成残渣，他这么怕的其实是什么呢？", "student_asr": "怕的是火山喷发。", "ai_answer": "你说到怕火山爆发——他这么害怕，说到底是在担心什么呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861355554545868849/1788700831497.aac", "duration_s": 5, "created_at": "2026-09-06 21:20:40", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 7, "target_id": "859883224871219216", "userid": "479855144", "chatid": "859882915776114768", "textid": 5, "ai_question": "你很清楚地选了小王子的立场，很好。那你为什么这么觉得呢？说说你的理由吧。", "student_asr": "因为它长了这个刺，在很多时候都能保保护它，让它没法被拿走。", "ai_answer": "你说得很有道理，小王子眼里的花儿很脆弱，刺是它能想到的保护自己的办法，这让它心里多了些安全感。其实飞行员的角度也有他的道理，两种看法都站得住。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859882915776114768/1788349713685.aac", "duration_s": 17, "created_at": "2026-09-02 19:48:56", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 8, "target_id": "859547418981838936", "userid": "539796566", "chatid": "859547361662279689", "textid": 3, "ai_question": "文章塑造活无常这一形象的目的是什么？", "student_asr": "讽刺当时的正人君子。", "ai_answer": "你一下就抓到了核心的讽刺对象，鲁迅正是通过活无常这个心地善良的鬼，和那些虚伪的正人君子形成强烈对比，让鬼都有人情味、人反而不如鬼的讽刺效果更有力量。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859547361662279689/1788269660841.aac", "duration_s": 5, "created_at": "2026-09-01 21:34:34", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 9, "target_id": "859164732626665518", "userid": "650744325", "chatid": "859164570516971594", "textid": 5, "ai_question": "你已经说到了长妈妈为小鲁迅买来《山海经》这件事，能再回忆一件具体发生的事，说说长妈妈做了什么吗？", "student_asr": "他去找鲁迅，问什么是山海经，并且设法把他给他买了山海经。", "ai_answer": "你已经准确梳理出长妈妈主动询问《山海经》，还真的为小鲁迅买到了这本他心心念念的书，是件很动人的细节。另外文中还写到，长妈妈睡觉时在床上摆成“大”字，挤得小鲁迅没地方翻身。这些细碎的小事凑在一起，就让长妈妈的形象特别真实立体。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859164570516971594/1788178422343.aac", "duration_s": 8, "created_at": "2026-08-31 20:13:54", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 10, "target_id": "860989874637951058", "userid": "538793548", "chatid": "860989720849686579", "textid": 5, "ai_question": "你看向第48页，从“至于我们”开头的那段第二句，找找活无常身上的颜色和其他红红绿绿的鬼有什么不同。", "student_asr": "白色", "ai_answer": "你抓到了最醒目的外形特点，他活泼诙谐，又浑身雪白在一众红红绿绿的鬼物里格外突出，自然就成了大家最愿意看的存在。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860989720849686579/1788613574216.aac", "duration_s": 6, "created_at": "2026-09-05 21:06:22", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 11, "target_id": "861004374338539598", "userid": "286913850", "chatid": "861004173209149461", "textid": 3, "ai_question": "请你按照下面的格式，说一说这两篇文章的主旨。", "student_asr": "读完这两篇，发现白船就揭示了，呃，呃，私塾和学，呃，私塾和学生之间的矛盾，所既展现了作者对于旧社会的思想，学校思想，和同学，呃，和高年级令人讽刺的事情，以及对新知识新思想的渴望。", "ai_answer": "你已经答出了对新思想的渴望这一点，再想想第一处空，百草园代表的是儿童的自由天性，和它形成矛盾的是什么呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861004173209149461/1788616997979.aac", "duration_s": 37, "created_at": "2026-09-05 22:03:59", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 12, "target_id": "859097611385303042", "userid": "417704494", "chatid": "859097494355705920", "textid": 3, "ai_question": "你看透了汉奸的本质！在这个屋子里，面对不可一世的山田大佐，不同的人表现出了完全不同的姿态。请你先从文中找一找，警备队长等汉奸是什么表现？", "student_asr": "我爸关的，又不是我关的。", "ai_answer": "我这边没太听清你说的内容，把注意力拉回到书中的这一段哦，翻到123页，山田大佐一走进来，警备队员们马上做了什么动作？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859097494355705920/1788162420835.aac", "duration_s": 5, "created_at": "2026-08-31 15:47:11", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 13, "target_id": "859073364159889439", "userid": "328124560", "chatid": "859072560674111544", "textid": 5, "ai_question": "你说到了囤柴火这件事，也提到了手套和大衣，咱们可以再看看原文里，手套是从谁那里讨来的，大衣是从谁那里得到的呀。", "student_asr": "嗯，很帅，欧辛基", "ai_answer": "辛格比迎战前的准备其实很清楚：保暖靠河狸兄弟给的毛皮大衣和麝鼠表弟给的连指手套，生火备好柴火、干树皮、树枝和松针，还用凿冰垂钓的办法解决了食物问题。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859072560674111544/1788156515625.aac", "duration_s": 120, "created_at": "2026-08-31 14:10:50", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 14, "target_id": "861195202369454118", "userid": "331809092", "chatid": "861195038468857950", "textid": 3, "ai_question": "结合选段内容，说说坐车人的性格特点，这对表现主人公祥子有什么作用。", "student_asr": "说明祥子不求多，他已经软弱下来，不再那么要强。", "ai_answer": "你点出了祥子的状态变化，咱们先回头看看暴雨里坐车人的言行，你能用一个词概括他是什么样的人吗？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861195038468857950/1788662509913.aac", "duration_s": 23, "created_at": "2026-09-06 10:42:16", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 15, "target_id": "859475786523217973", "userid": "157390728", "chatid": "859475537968668702", "textid": 5, "ai_question": "你说到了他最终凿开岩壁的动作，很准。再想想，在举起镐凿下去之前，他还先做了什么？", "student_asr": "不知道，不知道。", "ai_answer": "没关系，我们把这条行动链看全：汉恩斯先拿起镐，把耳朵贴在岩壁上仔细听，慢慢移动找到岩壁最薄的地方，再小心凿开一道缝。这一套连贯的动作，才让大家喝到了救命的地下水。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859475537968668702/1788252579852.aac", "duration_s": 11, "created_at": "2026-09-01 16:49:55", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 16, "target_id": "860258363831848995", "userid": "408864028", "chatid": "860257851963088943", "textid": 9, "ai_question": "哇，你一下子就抓住他的心思啦！他怕露怯被笑话，最核心的原因是什么呀？书里说他可是很爱什么的？", "student_asr": "他很是很爱耍花招。", "ai_answer": "嘿嘿，我来揭秘啦，其实是他太爱面子，拉不下脸承认自己不会，宁可尾巴泡在凉水里也不肯服软。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860257851963088943/1788439168551.aac", "duration_s": 5, "created_at": "2026-09-03 20:39:36", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 17, "target_id": "859074861245595650", "userid": "672697002", "chatid": "859074652692054069", "textid": 3, "ai_question": "哇——老爷爷从一匹马一路换到一袋烂苹果，换成我都要急死了！可老奶奶呢，换牛她说好交易，换羊她说更好，换鹅她说美妙的想法，连烂苹果她都说真叫人开心！你说说看，老奶奶到底是个什么样的人呀？", "student_asr": "老奶奶是一个知足的人，因，因为每说一个，她都很知足了。烂苹果，她也很满意。", "ai_answer": "欸嘿，你这个词抓得特别准！她每一次都能接住当下的小美好，知足又开心。那你能不能再想一个更常用的词来形容她呀？不管碰到什么情况都先往好的一面看，这种人我们叫什么呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859074652692054069/1788156988514.aac", "duration_s": 14, "created_at": "2026-08-31 14:16:47", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 18, "target_id": "859531875352436741", "userid": "402771380", "chatid": "859531793139802168", "textid": 3, "ai_question": "请结合相关情节，说说虎妞对祥子产生了怎样的影响。", "student_asr": "用户未回答", "ai_answer": "咱们缩小点范围，回想祥子听到虎妞要出钱给他买车的反应，说说这事给他的买车理想带来了怎样的变化。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859531793139802168/1788265959072.aac", "duration_s": 6, "created_at": "2026-09-01 20:32:48", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 19, "target_id": "859838865903648789", "userid": "1139548335", "chatid": "859838626056466486", "textid": 5, "ai_question": "别急哈，咱先盯着第118页老鹿王回答斑比后的第一句话，把“我带你去……”后面的内容读出来就行。", "student_asr": "我带，我带你去，我带你去见识一下外面的吃东西，并且我没有书，我怎么画呀？这话说的。", "ai_answer": "没事，咱不用画。老鹿王明确说要带斑比去见“他”，也就是去见识一件事。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859838626056466486/1788339134689.aac", "duration_s": 22, "created_at": "2026-09-02 16:52:40", "prelabel": "疑似有噪声", "prelabel_reason": "\"我带你去见识外面的吃东西...这话说的\"后半像对旁人抱怨"}, {"idx": 20, "target_id": "859192720881668193", "userid": "231331256", "chatid": "859192451569684578", "textid": 5, "ai_question": "你说到了第三起的分量差别，咱们把视角落到钱上，用“前两次……第三次……”说说买车钱的来路有啥不一样？", "student_asr": "我觉得这个根本没必要说，重要的是，前几次他都是自由的，只不过这最后一次所谓的骑，他已经属于是十分不自由的了，早就与他以前的理想和买车的意义背道而驰。所以，现在的他，我觉得买上车已经没有任何意义。", "ai_answer": "你看出祥子失去自由这个关键，已经摸到门道了。前两次买车的钱都是他自己没日没夜拉车，一点一点攒出来的，这第三次的车是虎妞掏出一百块钱帮他买的。钱不再攥在自己手里，表面看是重新有了车，内里的滋味可完全不一样了。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859192451569684578/1788185030701.aac", "duration_s": 19, "created_at": "2026-08-31 22:05:07", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 21, "target_id": "860902849343774772", "userid": "175050770", "chatid": "860902784126533713", "textid": 3, "ai_question": "鲁迅是怎么描写这群高年级学生的？你觉得他们这副做派，给人一种什么样的感觉呢？", "student_asr": "难受，他们非常的高傲，看不起你", "ai_answer": "你准确读出了他们高傲的劲儿，那你能说说从原文里哪些具体描写看出来的吗？想想他们怎么走路、像什么动物。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860902784126533713/1788592829339.aac", "duration_s": 3, "created_at": "2026-09-05 15:20:34", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 22, "target_id": "860256708444864588", "userid": "490728690", "chatid": "860256635178872898", "textid": 3, "ai_question": "你在刚才的阅读里，都看到衍太太对孩子们做了哪些事呢？说一两件让你印象深刻的事情吧！", "student_asr": "既反现实又反人性，什么时候？", "ai_answer": "你可以先回看第75页，冬天孩子们吃冰的时候，衍太太是什么反应呀？说说这一件事就行。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860256635178872898/1788438774462.aac", "duration_s": 4, "created_at": "2026-09-03 20:33:02", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 23, "target_id": "859744277142610016", "userid": "527379903", "chatid": "859744190056362081", "textid": 3, "ai_question": "这个“名医”有什么特点？", "student_asr": "故弄玄虚，贪索钱财，巫医不分", "ai_answer": "你一下点出了他故弄玄虚、贪财的两处核心特点，特别敏锐。再看看他给城外急病的闺女看病、治不好父亲的病之后的做法，还能看出什么特点？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859744190056362081/1788316591561.aac", "duration_s": 12, "created_at": "2026-09-02 10:36:48", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 24, "target_id": "859156846660018261", "userid": "507335636", "chatid": "859156744142839823", "textid": 3, "ai_question": "陈莲河和前文中的“名医”有哪些相同与不同之处？请简要概括。", "student_asr": "用户未回答", "ai_answer": "我们先从好入手的地方想：两人最后都没能治好父亲的病，诊金也都不低，你能先说说他俩有什么相同点吗？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859156744142839823/1788176536164.aac", "duration_s": 14, "created_at": "2026-08-31 19:42:34", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 25, "target_id": "859167051657445446", "userid": "1097111315", "chatid": "859166493571817571", "textid": 9, "ai_question": "你注意到马修眼里噙着的泪水啦，不过他躲开不是难过，是兴奋又骄傲地在心里自言自语，夸安妮聪明又有爱心。那你再说说马瑞拉在安妮离家前，都为她张罗了什么呀？", "student_asr": "都为她张漏马瑞拉却却哭，张漏了，哭擦眼泪，而且上边还有一个毛巾布。", "ai_answer": "我明白你留意到的这些细节啦。安妮拼命备考想名列前茅，让马修和马瑞拉感到骄傲；马修没有多说什么，只是借着星光躲开，偷偷在心里骄傲地夸安妮；马瑞拉嘴上不说软话，却悄悄为安妮张罗好上学要用的所有东西，安排人给她做合身的新裙子，还直白说出了心里舍不得的空落落的感受。有人用拼命的努力当礼物，有人用温柔的话语给力量，有人把关心缝进了一针一线里。爱不一定要大声说出口，但早就藏在了他们为彼此做的每一件小事中。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859166493571817571/1788178950954.aac", "duration_s": 29, "created_at": "2026-08-31 20:23:07", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 26, "target_id": "860936691521818645", "userid": "465000828", "chatid": "860936588388196366", "textid": 3, "ai_question": "寒冷饥饿、森林被破坏，还有接连不断地失去……斑比的世界彻底变了。想想妈妈离开前的叮嘱，你觉得接下来他需要学会哪些事情呢？", "student_asr": "他现在要学会自己独立生活了。", "ai_answer": "这个说得好！除了学会独立生活，你觉得斑比遇到危险的时候，还需要学会什么呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860936588388196366/1788600892221.aac", "duration_s": 7, "created_at": "2026-09-05 17:35:02", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 27, "target_id": "860899963545272378", "userid": "580602062", "chatid": "860899803163271256", "textid": 3, "ai_question": "戏中的活无常做了什么事呢？从中能看出活无常怎样的特点？", "student_asr": "大王出了票牌，叫我去拿隔壁的癞子。我知道，嗯，阿嫂哭的伤悲暂时还，呃，绽放，她还阳半刻。", "ai_answer": "你已经抓住了放阿侄还阳半刻这个关键情节，那你觉得这个行为能看出活无常有什么特点呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860899803163271256/1788592115797.aac", "duration_s": 26, "created_at": "2026-09-05 15:09:06", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 28, "target_id": "861277230997848155", "userid": "407653492", "chatid": "861276863920754769", "textid": 5, "ai_question": "你已经作出了不矛盾的判断，我们先从一处说起，看看第12到13页的景物，说说外婆为什么会快乐得像个孩子。", "student_asr": "嗯，因为，因为外婆，外婆就是，嗯，因为水手说她的那个啥，哎呀，我也不，哎呀。", "ai_answer": "没关系，你不用急着说全，先看看第13页外婆回答“为什么哭”的内容，说说她自己给出的流泪的原因是什么。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861276863920754769/1788682062582.aac", "duration_s": 27, "created_at": "2026-09-06 16:08:13", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 29, "target_id": "859142323416850466", "userid": "357372488", "chatid": "859142209058979934", "textid": 3, "ai_question": "在文章中找一找，鲁迅为什么反感“老莱娱亲”这个故事吧！", "student_asr": "因为，因为老来为了逗自己的父母开心，竟当，竟把自己当做婴儿一样啼哭。", "ai_answer": "你准确抓住了老莱子装作婴儿啼哭这个具体行为，再看看第36页末到37页开头作者谈小孩子心理的话，说说鲁迅为什么会反感这样的做法呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859142209058979934/1788173071773.aac", "duration_s": 16, "created_at": "2026-08-31 18:44:51", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 30, "target_id": "859878462566039614", "userid": "391682070", "chatid": "859878394660335652", "textid": 3, "ai_question": "这个“名医”的医术怎么样？从哪里看出来的？", "student_asr": "感觉他的医术，感觉就像根本没有一样，他就是胡乱开方。", "ai_answer": "你这个判断方向很准，能不能从刚才读的原文里，找个具体细节来证明他医术不行呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859878394660335652/1788348592055.aac", "duration_s": 8, "created_at": "2026-09-02 19:30:01", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 31, "target_id": "861283916793909336", "userid": "487426374", "chatid": "861283583455772696", "textid": 7, "ai_question": "你提到了叔叔和汉恩斯，阿克赛转身时，他们早就不在身边了。他和叔叔、汉恩斯失散，孤身一人困在了坑道里。在绝境中，阿克赛打算怎样自救？", "student_asr": "矿泉水", "ai_answer": "第121页里，他把泉水叫做“忠实的向导”——他打算靠它做什么？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861283583455772696/1788683678528.aac", "duration_s": 4, "created_at": "2026-09-06 16:34:47", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 32, "target_id": "860605578635067397", "userid": "412393726", "chatid": "860604277243027535", "textid": 16, "ai_question": "面对小偷会让他变成小狗体验一天受教训，面对善良的好心人会送出玩具和好吃的恩赐，真是一位惩恶扬善又软萌贴心的好神明。我把你的奇思妙想整理好啦，你试着参考“表达时刻”读一读，小小创造神，恭喜你，你已经创造出这个世界上独一无二的神啦！", "student_asr": "创作之神的小狗，天生愈能闻到初年坏头，坏人，它会让小狗，嗯，小狗都变成一小狗，一整天，以此来惩罚它，和教育。", "ai_answer": "没读完整也不要紧，如果刚才能完整读完，会更能展现你创造的独一无二的小狗神哦！", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860604277243027535/1788521932343.aac", "duration_s": 25, "created_at": "2026-09-04 19:39:19", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 33, "target_id": "859069229700472911", "userid": "525349004", "chatid": "859068951102083072", "textid": 6, "ai_question": "哈哈，那说不定还有没被发现的恐龙骨头呢！如果让你在这些矿石里挖出一件宝贝，你最想挖到什么？", "student_asr": "最想挖到恐龙化石，我点两个，始终允许它，就那个。", "ai_answer": "挖出完整的恐龙化石，那可太酷了！下面，就由我陪你进入《地心游记》这本书中的探险世界。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859068951102083072/1788155652476.aac", "duration_s": 12, "created_at": "2026-08-31 13:54:25", "prelabel": "疑似有噪声", "prelabel_reason": "\"我点两个,始终允许它,就那个\"后半像操作设备/对旁人说"}, {"idx": 34, "target_id": "861267245039497277", "userid": "572047437", "chatid": "861266977488961616", "textid": 5, "ai_question": "你有两个细节说对了，但长妈妈踩死的不是小鼹鼠，是鲁迅心爱的隐鼠哦。你再确认下这两件事的准确说法，就能把它们梳理得更清楚啦。", "student_asr": "他第一件事是，常妈妈踩死他的小寅鼠，却说是被猫吃了的事。第二件事是，常妈妈给鲁迅买来山海经。", "ai_answer": "你已经准确梳理出两件核心事件：长妈妈一脚踏死了鲁迅的隐鼠，还为鲁迅心心念念买来绘图《山海经》。这一冷一暖的两件事，让长妈妈的形象一下子变得真实又鲜活，不是扁平的符号。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861266977488961616/1788679694273.aac", "duration_s": 15, "created_at": "2026-09-06 15:28:32", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 35, "target_id": "860188357114769413", "userid": "458858378", "chatid": "860188174654365774", "textid": 5, "ai_question": "你抓住了长妈妈身份普通却办成事的反差这一点，再看看第27页里小鲁迅为了这本书，之前遇到了哪些没法解决的难处呀？", "student_asr": "他念念不忘这本书，天天都想着", "ai_answer": "你说到了小鲁迅对这本书渴慕已久，又点明了普通保姆长妈妈却帮他办成了大家都没做到的事。书越难得到，完成这件事的人越出乎意料，这份藏在里面的真心关爱，带给他的震动就越大。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860188174654365774/1788422474445.aac", "duration_s": 7, "created_at": "2026-09-03 16:01:25", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 36, "target_id": "859852105735872522", "userid": "1076767283", "chatid": "859851906334425160", "textid": 5, "ai_question": "哈哈，咱们说的可不是虫子，是国王手里那粒神奇的种子哦。你看屏幕上国王那段话的最后一行“这才显得我……”，想想他到底想显出自己怎么样？", "student_asr": "我最尊贵，最有权利。", "ai_answer": "哎，你一眼就看穿国王的小心思啦。没错，他种这粒种子的真正目的，就是为了显示自己最尊贵、最有权力。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859851906334425160/1788342311534.aac", "duration_s": 3, "created_at": "2026-09-02 17:45:17", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 37, "target_id": "859156050908135457", "userid": "350915360", "chatid": "859155924089077761", "textid": 5, "ai_question": "你判断的方向很准，能不能从刚才读的文字里，找出一个具体的细节来支撑这个说法呢？", "student_asr": "嗯，嗯，嗯，嗯嗯。", "ai_answer": "这位“名医”给城外的急病闺女生怕地看了一眼就说不要紧，转天病人已经没了脉；给鲁迅父亲治了两年，水肿却逐日加重，足见他医术平庸拙劣，名不副实。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859155924089077761/1788176357493.aac", "duration_s": 4, "created_at": "2026-08-31 19:39:24", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 38, "target_id": "859164421589778490", "userid": "553149438", "chatid": "859164214059737184", "textid": 3, "ai_question": "你觉得哪一句体现了神话神奇的想象呢？快跟我说说它不可思议的地方吧！", "student_asr": "第二个，因为普通的箭不可能把太阳射下来，它这里边写，它里边写，而且太阳也不可能是大鸟，所以呢，它就是把鸟把太阳写，写作，鸟把普通的箭写为很好的箭，射掉太阳。", "ai_answer": "哇，你一下就抓准了最神奇的点！我当时就在山边看着，后羿箭射出去时太阳掉下来的样子，书上写太阳本来就是三足乌鸦，可不是射中之后才变成鸟的哦。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859164214059737184/1788178320317.aac", "duration_s": 34, "created_at": "2026-08-31 20:12:40", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 39, "target_id": "859553825558806598", "userid": "642645283", "chatid": "859553772731518991", "textid": 3, "ai_question": "为什么活无常是大家最愿意看的呢？", "student_asr": "因为活无常，他是", "ai_answer": "你可以回看第48页“至于我们”开头的那段话的第二句，鲁迅用了“不但……单是那……”的句式，从两个角度夸了活无常，你试着说说看是哪两个方面呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859553772731518991/1788271195442.aac", "duration_s": 4, "created_at": "2026-09-01 22:00:01", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 40, "target_id": "859055700490326060", "userid": "520013088", "chatid": "859055608568045601", "textid": 3, "ai_question": "请你想一想，鲁迅对活无常和“正人君子”的态度分别是怎么样的？", "student_asr": "对于活无常，却是非常的喜爱，认为他做的对，但作为，但对正人君子却非常的厌恶。", "ai_answer": "你精准抓到了两边的反差，一下子就看懂了鲁迅写鬼的人情，来对比讽刺阳间虚伪之人的用心，这份对比的敏感度很棒。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859055608568045601/1788152424465.aac", "duration_s": 11, "created_at": "2026-08-31 13:00:39", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 41, "target_id": "859122186823336032", "userid": "534342625", "chatid": "859122052962123789", "textid": 3, "ai_question": "从《琐记》鲁迅对南京新学堂以及自己读《天演论》的描写中，你能感受到鲁迅对当时的教育体制持什么态度？他又在渴望什么？", "student_asr": "当时的教育体制是爱学不学，不管不顾，无所谓，他在渴望，如果学生都能受到正规教育，那该有多好？", "ai_answer": "你抓到了学堂散漫放任的状态，那从他用\"乌烟瘴气\"形容学堂、还直接转身离开的细节来看，他对这种教育体制具体是什么态度呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859122052962123789/1788168272235.aac", "duration_s": 14, "created_at": "2026-08-31 17:24:51", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 42, "target_id": "859158816502169676", "userid": "507885583", "chatid": "859158587438579758", "textid": 5, "ai_question": "你说的这里人物关系有一点小偏差哦，这不是鲁迅的妈妈，你再回看第27页长妈妈告假回来递出一包书的情境，说说她到底为小鲁迅做了什么？", "student_asr": "常妈妈给小鲁迅买了书，然后呢，然后呢，就没了", "ai_answer": "你准确说出了长妈妈为小鲁迅买来绘图《山海经》这件事，我们再补充另一件：隐鼠并不是被猫害死的，是它缘着长妈妈的腿往上爬，被长妈妈一脚踏死的。这两件事合在一起，就让长妈妈这个形象既真实又立体。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859158587438579758/1788177010164.aac", "duration_s": 15, "created_at": "2026-08-31 19:50:24", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 43, "target_id": "859157486748557324", "userid": "343122986", "chatid": "859157203955859469", "textid": 5, "ai_question": "这个柔缓的叮咚声特别有画面感，它是像溪水流过卵石那样清透，还是像挂在洞口的风铃那样悠悠回响呢？", "student_asr": "它是像溪水流过卵石那样清透。", "ai_answer": "这个随心意变换的气味很是奇妙，那它的气味是轻轻淡淡地裹在水汽里飘过来，还是清清楚楚扑面而来的呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859157203955859469/1788176699912.aac", "duration_s": 4, "created_at": "2026-08-31 19:45:07", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 44, "target_id": "861165462493478947", "userid": "631031726", "chatid": "861165233245319212", "textid": 5, "ai_question": "你已经点出了船长贪财的特点，能不能说说船长具体打破了哪几条自己当初说死的原则呢？", "student_asr": "一不带旅客，二不坚持坚，二打破规则，去利瑞普，三同同意，用六万美元元买下这座船，然后呢，留下铁皮。", "ai_answer": "你抓住了最核心的两处：他原本说从来不带旅客，又铁口直断船绝对不卖，结果在金钱的诱惑下两次破戒，最后连自己心爱的船被拆了当燃料都没意见。这个过程清清楚楚地显出，船长是个见钱眼开、在金钱面前毫无原则的人。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861165233245319212/1788655421279.aac", "duration_s": 18, "created_at": "2026-09-06 08:44:05", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 45, "target_id": "859085921629339690", "userid": "690994597", "chatid": "859085330979004427", "textid": 9, "ai_question": "这个想象特别贴合海边的生活，天天和大海打交道的人，确实很容易把和水、鱼相关的形象编进神话里。从海边、草原、森林这些不同的地方，会创造出不同的神话，你体会到了什么呀？", "student_asr": "人们根据自然环境的变化，变化适应。", "ai_answer": "你说到了人和自然的关联，能不能再想想，这为什么会让不同地方的神话长得不一样呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859085330979004427/1788159624472.aac", "duration_s": 17, "created_at": "2026-08-31 15:00:44", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 46, "target_id": "859152668608847883", "userid": "481393076", "chatid": "859152340094124095", "textid": 6, "ai_question": "哈哈，这降龙伏虎的本事谁不爱？要是你真得了这七十二变和如意金箍棒，最想去干一件什么威风事？", "student_asr": "如果我真有那些功能了，那我就是，嗯，想帮那些公安局，什么打小偷。", "ai_answer": "妙极！真不愧是好汉行径。你这满腔的正义感，倒和那大闹天宫的孙行者一模一样，都是个降妖除魔的直性子！今天我们就回到这本书，好好读一读。现在，先来瞧瞧我们今天要读什么吧！", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859152340094124095/1788175546180.aac", "duration_s": 8, "created_at": "2026-08-31 19:25:58", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 47, "target_id": "860621619356368985", "userid": "467771058", "chatid": "860621365802217543", "textid": 3, "ai_question": "祥子开始抢老弱车夫的生意了，你赞同他的行为吗？说说原因。", "student_asr": "不赞同，因为那些老弱车夫身体很虚弱，他应该多帮一些才行。", "ai_answer": "你看得很准，说到了老弱车夫的难处。老弱车夫体力差，拉车是他们糊口的唯一门路，祥子年轻力壮去抢，断的是别人的活路。以前的祥子绝不会这么做，如今连这条底线都没了，正是他道德开始滑坡的起点。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860621365802217543/1788525680437.aac", "duration_s": 46, "created_at": "2026-09-04 20:43:03", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 48, "target_id": "861041703170166863", "userid": "283912702", "chatid": "861041576007405660", "textid": 3, "ai_question": "少年鲁迅读《天演论》时候的状态是怎么样的呢？从中能看出少年鲁迅求学时有什么特点？", "student_asr": "的，他的状态是", "ai_answer": "你可以试着结合他一有空就捧着《天演论》读、不理会长辈指责的细节，想想他求学有什么特点呀。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861041576007405660/1788625918408.aac", "duration_s": 16, "created_at": "2026-09-06 00:32:19", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 49, "target_id": "860890458971185160", "userid": "648526235", "chatid": "860890324111814691", "textid": 3, "ai_question": "为什么长妈妈买《山海经》这件事对小鲁迅的震动这么大？", "student_asr": "因为他父亲不让他看这种，而是逼着他看别的书，他就一直很想要一本山海经。", "ai_answer": "你说到了小鲁迅对这本书的渴慕，你再看看第27页里，别人面对他想找《山海经》的心愿时是怎么做的呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860890324111814691/1788589855277.aac", "duration_s": 23, "created_at": "2026-09-05 14:31:19", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 50, "target_id": "859184758473773067", "userid": "174232234", "chatid": "859184584711999573", "textid": 3, "ai_question": "回顾一下，百草园和三味书屋的生活有什么不同？到了三味书屋里，小鲁迅还能像在百草园那样自由自在、天性得到释放吗？", "student_asr": "嗯，不行，百草园里的生活更加自由自在，而三味书屋里的生活却更加，却只有学习，不能像百草园那样，天性得到释放。", "ai_answer": "你准确抓住了两处核心反差，直接点出了从百草园的自由探索到三味书屋被规矩约束的变化，看得很准。百草园是完全属于他的乐园，三味书屋的枯燥规矩确实困住了他的天性。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859184584711999573/1788183180874.aac", "duration_s": 24, "created_at": "2026-08-31 21:33:29", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 51, "target_id": "859878725070725124", "userid": "1002913633", "chatid": "859878614043471936", "textid": 3, "ai_question": "大鹏不怕危险去取甘露，体现了勇敢无畏；现在面对能长生不老的甘露，他一口没喝，还愿意把它还回去。你觉得这又说明他有什么品质？", "student_asr": "我不管，好吧？行行，行。", "ai_answer": "没关系，我们不用想复杂的词。你觉得大鹏拿到甘露后，是只顾自己，还是先想着母亲？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859878614043471936/1788348656510.aac", "duration_s": 4, "created_at": "2026-09-02 19:31:03", "prelabel": "疑似有噪声", "prelabel_reason": "\"我不管,好吧?行行,行\"像和旁人对话应付"}, {"idx": 52, "target_id": "859030881862524987", "userid": "731085088", "chatid": "859030776766013473", "textid": 3, "ai_question": "原来这项“神秘训练”，竟然是去高高的钟楼上体验头晕目眩！看着屏幕上这个深不见底的火山口，你觉得教授为什么非要带阿克赛进行“登高晕眩训练”呢？", "student_asr": "因为怕，他们在火山口的时候，就给吓晕了。", "ai_answer": "你抓到了最关键的那个怕字，再想想，阿克赛在钟楼上已经体会过的这种头晕腿软，和站在火山口边的感受有什么像的地方？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859030776766013473/1788146513196.aac", "duration_s": 5, "created_at": "2026-08-31 11:22:02", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 53, "target_id": "860961919736029233", "userid": "238047632", "chatid": "860961738693292064", "textid": 5, "ai_question": "你说的方向是对的，可别忘了电母和雷公配合有个先后顺序哦，电母先照明，雷公再打雷，你想想生活里雷雨时闪电和雷声谁先出现呀？", "student_asr": "闪电", "ai_answer": "对啦，古人发现雷雨天总是先看到闪电，再听到雷声，就用“电母先照明、雷公再打雷”的故事来解释这个自然现象。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860961738693292064/1788606907821.aac", "duration_s": 6, "created_at": "2026-09-05 19:15:17", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 54, "target_id": "860981307377770549", "userid": "701889901", "chatid": "860981210594254903", "textid": 3, "ai_question": "为什么长妈妈买《山海经》这件事对小鲁迅的震动这么大？", "student_asr": "因为他的父亲都无法做到的事，是常妈妈做的。", "ai_answer": "你观察到了“旁人没做到而长妈妈做到了”这个关键点，再试着找找第20页里关于长妈妈身份的介绍，说说这部分和震动的关联吧。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860981210594254903/1788611523425.aac", "duration_s": 11, "created_at": "2026-09-05 20:32:19", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 55, "target_id": "861246293727514665", "userid": "333767028", "chatid": "861245835789299748", "textid": 7, "ai_question": "没关系，我们换个角度想——站在这片大海前，会有什么样的声音传进你的耳朵呢？", "student_asr": "我不敢擦，有点臭。老师。擦完了就擦完了，边上擦了没？你那屁股老干净了一擦就屎，一擦，屎就全下来了。真快。答，回答，回答。", "ai_answer": "试着说一说你内心的感受吧，哪怕只说一点点也没关系。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861245835789299748/1788674663561.aac", "duration_s": 50, "created_at": "2026-09-06 14:05:17", "prelabel": "疑似有噪声", "prelabel_reason": "\"我不敢擦有点臭。老师...你那屁股一擦屎就下来\"像家长在旁管孩子/多人"}, {"idx": 56, "target_id": "860261538722922587", "userid": "408202390", "chatid": "860261461317070910", "textid": 3, "ai_question": "从“探望阿廖沙”这个情节，可以看出茨冈是个什么样的人？你从哪里看出来的？", "student_asr": "可以看出来，慈刚是一个十分善良的人。", "ai_answer": "你抓到了他最核心的性格特点，能不能从第35页的内容里找一句他说的话或是做的事，来支撑这个判断呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860261461317070910/1788439922233.aac", "duration_s": 5, "created_at": "2026-09-03 20:52:13", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 57, "target_id": "859111672583819312", "userid": "292063936", "chatid": "859111509115285526", "textid": 5, "ai_question": "你记住了和炮弹有关的关键情节，不过还缺一个重要动作哦——男爵从自己正骑着的那发炮弹上做了什么才回去的？", "student_asr": "坐上去，从坐上，炮弹上回去的。", "ai_answer": "男爵是趁敌人打来一发炮弹时，纵身一跳，跃到了那发炮弹上，骑着它飞回了自己的营地。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859111509115285526/1788165774684.aac", "duration_s": 7, "created_at": "2026-08-31 16:43:04", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 58, "target_id": "859168497924718595", "userid": "390605562", "chatid": "859168114074648639", "textid": 7, "ai_question": "这里有个小偏差哦，阎罗王是铁面冷酷的鬼，并不是鲁迅要批判的对象。你可以回看原文里提到的“正人君子”，想想鲁迅把活无常和他们放在一起写，目的是什么？", "student_asr": "做对比", "ai_answer": "你终于点出了最关键的对比手法。鲁迅把有人情味的活无常，和那些嘴上高喊公理、现实里却冷漠虚伪的正人君子放在一起对照，讽刺这类人鬼都不如，露出了他们虚伪的真面目。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859168114074648639/1788179318180.aac", "duration_s": 8, "created_at": "2026-08-31 20:28:52", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 59, "target_id": "860997082096377938", "userid": "350740860", "chatid": "860996800629444643", "textid": 7, "ai_question": "你说的是后面出场的陈莲河医生的情节，咱们现在说的是给鲁迅父亲治了两年、后来推荐陈莲河的第一位名医哦。你回看第66到68页，找找他看病时的细节？", "student_asr": "根本就不把脉，什么的，做那些中医该做的事情。", "ai_answer": "你抓到了他敷衍糊弄的要害，他给城外急病的闺女只草草地看了一眼就说不要紧就走，第二天病人都没脉了，完全是判断失误。他给鲁迅父亲治了两年，水肿反而越来越重，靠难寻的药引故弄玄虚，根本没真本事，就是个名不副实的庸医。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860996800629444643/1788615289411.aac", "duration_s": 6, "created_at": "2026-09-05 21:35:00", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 60, "target_id": "859187558972776494", "userid": "355865562", "chatid": "859187375430041634", "textid": 5, "ai_question": "她嘴上确实提了这些东西，可她真的只是想要一壶水吗？小王子每次跑前跑后，她真正高兴的是什么呢？", "student_asr": "看他累的样子。", "ai_answer": "没错，花儿想要的根本不是水和风障，而是小王子的关心和在乎。那你觉得这朵花儿嘴上说的和心里想的不一样，可以用个什么词来形容她呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859187375430041634/1788183872206.aac", "duration_s": 4, "created_at": "2026-08-31 21:44:36", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 61, "target_id": "860661591111200780", "userid": "744393493", "chatid": "860661458743300137", "textid": 5, "ai_question": "不用急着说完整观点，你可以先从两篇里挑出一篇，说说里面哪件事让小鲁迅觉得压抑难受。", "student_asr": "用户未回答", "ai_answer": "哪怕只选一个篇目，告诉我它带给小鲁迅的感受是愉快，还是压抑、反感也可以。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860661458743300137/1788535303784.aac", "duration_s": 3, "created_at": "2026-09-04 23:21:53", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 62, "target_id": "859095753358876741", "userid": "462044194", "chatid": "859095606008807453", "textid": 3, "ai_question": "回顾一下，百草园和三味书屋的生活有什么不同？到了三味书屋里，小鲁迅还能像在百草园那样自由自在、天性得到释放吗？", "student_asr": "呃，百草园和三味书屋的不同在于，一个是童年的快乐时光，一个是学习的地方。小鲁迅到了三味书屋后，就没有像一待在百草园以前的那样自由了。", "ai_answer": "你抓住了最核心的区别，点出了鲁迅从完全自在的乐园，一下子掉进了满是规矩的书塾生活里，这样天性自然就被束缚住了。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859095606008807453/1788161965916.aac", "duration_s": 18, "created_at": "2026-08-31 15:39:48", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 63, "target_id": "859801657545011272", "userid": "461828646", "chatid": "859801584748466222", "textid": 3, "ai_question": "下面这段描写捕鸟过程的文字运用了一连串动词，请你说说使用这些动词的好处。", "student_asr": "生动形象地写出了", "ai_answer": "你抓住了动词让描写更生动的核心，那这样的描写让你感受到了什么，能看出小鲁迅什么样的心情与感受呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859801584748466222/1788330283063.aac", "duration_s": 4, "created_at": "2026-09-02 14:24:49", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 64, "target_id": "860957902041772078", "userid": "354458224", "chatid": "860957584247562278", "textid": 3, "ai_question": "读完了这一文段，我们来分析下陈莲河的人物形象。陈莲河和前文中的“名医”有哪些相同与不同之处？请简要概括。", "student_asr": "相同点，医术平庸，故弄玄虚，喜欢用古怪药引，收取高额诊费，治不好病。不同点，前文的名医治不好，会主动推荐别的医生，借机脱身。陈联合更狡诈，会提出更离奇的偏方，如拜骨皮丸，还想用迷信说辞，最后推卸责任，开脱自己。", "ai_answer": "你抓得很准，既点出了两人都是靠奇特药引故弄玄虚、诊金高昂却没真本事的庸医，也看清了陈莲河的行骗手段比前者更荒唐离谱，还会用迷信说辞搪塞推卸责任。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860957584247562278/1788605895979.aac", "duration_s": 58, "created_at": "2026-09-05 18:59:19", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 65, "target_id": "861204531344719964", "userid": "159174594", "chatid": "861204407516393477", "textid": 3, "ai_question": "少年鲁迅读《天演论》时候的状态是怎么样的呢？从中能看出少年鲁迅求学时有什么特点？", "student_asr": "阅读天演论的状态是如饥似渴的，从中能看出他求学的时候呢，是他求学的时候呢，喜欢读新书的特点。", "ai_answer": "你留意到他如饥似渴读新书的状态了，不过我们要往求学特征上再靠一靠，你想他一有空就看、连长辈劝都拦不住，能概括出他求学有什么特点吗？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861204407516393477/1788664739400.aac", "duration_s": 16, "created_at": "2026-09-06 11:19:20", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 66, "target_id": "861209912833740868", "userid": "622884280", "chatid": "861209320141004888", "textid": 5, "ai_question": "你已经说到了讽刺虚伪的人这层意思，能不能再说说鲁迅是靠着什么具体的对照，把这份讽刺写得特别戳人呢？", "student_asr": "啊，鲁迅先生靠的是，呃，这个，他那个，嗯，具体对照，呃，他把无偿，呃，呃，具体对照，把讽刺写的更出色，他拿的是无偿和那个，和那个，呃，那个叫啥呢？嗯，大无常和那个银银阎罗天，不是，这是叫啥？嗯，就是，嗯，好像是对比吧。他把那个鲁迅套着这个，具体就是无常和那个阎罗的，对阎罗王做对比吧，是。", "ai_answer": "你能抓住对比这个关键手法很厉害，不过这里的对照并不是活无常和阎罗王，鲁迅是把有人情味的活无常，和那些嘴上喊正义、实际却冷漠虚伪的正人君子放在一起比，讽刺他们人却不如鬼，连最基本的人情味都丢了。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861209320141004888/1788665950078.aac", "duration_s": 87, "created_at": "2026-09-06 11:40:43", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 67, "target_id": "860116798337454110", "userid": "718314879", "chatid": "860116537602850851", "textid": 7, "ai_question": "故事里风神的儿子并没有死，是被天帝的金刚杵打伤了下巴，风神心疼儿子，才带着他躲进山洞的。风神躲进山洞以后，给大地上的人和动物带来了什么变化？", "student_asr": "没怕刮风下雨被太阳晒死。", "ai_answer": "故事里的情况和你说的不太一样，风神躲起来后就没有风了，天神没有办法下雨，空气也不能流通，你再想想人和动物会怎么样？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860116537602850851/1788405414704.aac", "duration_s": 6, "created_at": "2026-09-03 11:17:04", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 68, "target_id": "859146814224424992", "userid": "702329585", "chatid": "859146705453457459", "textid": 3, "ai_question": "读完了这一文段，戏中的活无常做了什么事呢？从中能看出活无常怎样的特点？", "student_asr": "我和无常做了给一个孩子翻羊半课，然后可以看出，无常很善良。", "ai_answer": "你刚才的表述里有个小细节和原文不太对应哦，他是放那名阿侄还阳半刻，你再理一理活无常做的这件事，说说完整的情节好不好？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859146705453457459/1788174146115.aac", "duration_s": 13, "created_at": "2026-08-31 19:02:42", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 69, "target_id": "860868861384355932", "userid": "695576606", "chatid": "860868617930055738", "textid": 5, "ai_question": "你选了更贴近路路通的应对方式，能不能说说你为什么会觉得这种态度能帮你渡过难关，它有没有在哪件小事里帮过你呀？", "student_asr": "我觉得这种办法非常好。", "ai_answer": "我明白你觉得它好用，那它有没有在哪件具体的小事里帮过你呢？比如忘带东西、和朋友闹别扭这类事也行。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860868617930055738/1788584716209.aac", "duration_s": 11, "created_at": "2026-09-05 13:05:30", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 70, "target_id": "860941009880825884", "userid": "336106190", "chatid": "860940737116725262", "textid": 7, "ai_question": "你已经点出了这份反差，那你能说说活无常面对别人的生死时，带着什么样的心意吗？", "student_asr": "厚脸皮把我嘴都骂死了。", "ai_answer": "我先不催你想了，咱们把这层对比说清就好：活无常虽是勾魂的鬼差，却因阿嫂哭得悲伤暂放阿侄还阳半刻，满是人情味和同情心；而本该救人的名医，却只想着骗钱、敷衍推脱，对将死的病人冷酷无情。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860940737116725262/1788601921114.aac", "duration_s": 7, "created_at": "2026-09-05 17:52:12", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 71, "target_id": "861252507333287959", "userid": "718675963", "chatid": "861252231205404702", "textid": 3, "ai_question": "请你说一说这两个句子分别运用了什么修辞手法，有什么表达效果。", "student_asr": "分别用了拟人和比喻的修辞手手法，第一句运用了拟人油灵，呃，把油灵当做人来写，把幽灵和人和蟋蟀当做人来写，呃，生动形象的表现出，呃，他们的声音在大自然中的美妙。然后，第二句运用了女人的修辞手法，把覆盆子比作，呃，小珊瑚攒成的小球，生动形象的写出了覆盆子的外形，外形表达了。作者对这美景的赞美，以及对覆盆子的喜爱。", "ai_answer": "你第一句的拟人分析得很到位，但第二句的修辞判断有点混淆啦，比喻是用“像”把一个事物比作另一个不同事物，拟人是给事物赋予人的动作，你再重新看看第二句用的是什么修辞？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861252231205404702/1788676138536.aac", "duration_s": 52, "created_at": "2026-09-06 14:29:59", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 72, "target_id": "859402936198115333", "userid": "412264004", "chatid": "859402711987294258", "textid": 3, "ai_question": "请你结合今天读到的两篇文章，说一说鲁迅提到了长妈妈的哪些事。", "student_asr": "鲁迅提到了，常妈妈喜欢切切地观察，睡觉，会四仰八叉，踩死了银鼠，逼着鲁迅不准乱跑，还立下了很多规矩，但是，他却把鲁迅的话记在心中，尽管自己完全不知道那是个什么东西，也尽力地满足他的愿望。", "ai_answer": "你一下子梳理出了这么多细节：长妈妈喜欢切切察察、睡觉摆成大字、踩死隐鼠、管着小鲁迅不让他随意走动、立了很多烦琐规矩，还记住鲁迅的心愿给他买来《山海经》。这些不同的小事凑在一起，才让长妈妈成了一个真实又鲜活的普通人。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859402711987294258/1788235180329.aac", "duration_s": 39, "created_at": "2026-09-01 12:00:26", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 73, "target_id": "861225830033043539", "userid": "364272874", "chatid": "861225766078292029", "textid": 3, "ai_question": "这个“名医”的医术怎么样？从哪里看出来的？", "student_asr": "这个名医的医术还行，只不过有点儿不好。", "ai_answer": "你可以留意这两处关键对比：他给城外闺女看病说不要紧，第二天病人却已经没脉了；给鲁迅父亲治了两年，病情反而一天天加重，这能说明他的真实医术水平到底如何呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861225766078292029/1788669827814.aac", "duration_s": 6, "created_at": "2026-09-06 12:43:58", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 74, "target_id": "861259619907928140", "userid": "408434606", "chatid": "861259357894070327", "textid": 7, "ai_question": "你点出了他医术拙劣这个核心点，除此之外，再想想他的诊金开得很高，找的药引也特别难寻，这些又能看出他什么别的特点呢？", "student_asr": "还可以看出他贪财。", "ai_answer": "你从收费高昂的细节看出他贪财，又结合之前的分析点明他医术差，抓得很准。除此之外，他看病极其敷衍马虎，草草一看就走，还专靠难找的药引故弄玄虚撑名头，治了两年毫无效果就推荐别人来脱干系，是个徒有虚名的庸医。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861259357894070327/1788677884124.aac", "duration_s": 6, "created_at": "2026-09-06 14:58:14", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 75, "target_id": "859332100522909698", "userid": "1110331989", "chatid": "859332034039091217", "textid": 3, "ai_question": "读完之后，我想听听你的看法，你对黎登布洛克教授有怎样的印象呢？", "student_asr": "他很努力", "ai_answer": "你观察到他做事投入、很努力这一点没错。教授精通矿物学、地质学，能快速辨别矿石，熟练使用各类专业勘探工具，这能体现出他怎样的特点呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859332034039091217/1788218329253.aac", "duration_s": 4, "created_at": "2026-09-01 07:18:58", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 76, "target_id": "859009868764368955", "userid": "675189932", "chatid": "859009727898587198", "textid": 5, "ai_question": "你可以看看眼前的画面，再回看第27页长妈妈告假回来递东西的段落，说说她替小鲁迅做成了什么事。", "student_asr": "嗯，做了一些非常大的事情。", "ai_answer": "你摸到了这件事的分量，它就是长妈妈给小鲁迅买来了他心心念念的绘图《山海经》。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859009727898587198/1788141502036.aac", "duration_s": 7, "created_at": "2026-08-31 09:58:32", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 77, "target_id": "859170779982659600", "userid": "6777671", "chatid": "859170255082233899", "textid": 9, "ai_question": "这句是把两辆自行车比作哪吒脚底下的风火轮，生动写出了李民达他们骑车时风驰电掣的迅猛模样。再深挖一步！比喻不只是为了画面好看，更藏着人物的心情和状态。透过你选的这句比喻，你感受到人物当时是什么心情或状态？用自己的话说一说。", "student_asr": "呃，着急的", "ai_answer": "你说到了着急这个点，能再说说这份着急背后，藏着人物心里什么样的念头和在意的事吗？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859170255082233899/1788179864319.aac", "duration_s": 8, "created_at": "2026-08-31 20:37:56", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 78, "target_id": "861185530275246115", "userid": "396765088", "chatid": "861185440412139555", "textid": 3, "ai_question": "从买《山海经》这件事，你可以看出长妈妈是一个怎样的人？", "student_asr": "他妈妈是一个关爱孩子的人。", "ai_answer": "你点出了她关爱孩子这个很重要的品质，能不能结合长妈妈听说《山海经》的心愿之后做了什么来具体说说呀？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861185440412139555/1788660215950.aac", "duration_s": 9, "created_at": "2026-09-06 10:03:50", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 79, "target_id": "860235816285450243", "userid": "381176924", "chatid": "860235663730274341", "textid": 3, "ai_question": "接下来，就请你像小侦探一样，倒推回去找找原因。你回忆一下，在这些鸬鹚跳下水之前，鲤鱼们到底做了什么，才把它们招惹下来的？", "student_asr": "鲤鱼，给它，给那个鲈，鱼鸬鹚，把它吸引下来，才会被捉的。", "ai_answer": "你方向已经摸到边啦，咱们去翻翻第43到44页，鲤鱼仰着脸对船舷上的鸬鹚说了一番什么欢迎的话，具体做了啥动作呀？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860235663730274341/1788433781310.aac", "duration_s": 16, "created_at": "2026-09-03 19:10:01", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 80, "target_id": "860962066968662088", "userid": "533495457", "chatid": "860961610297077806", "textid": 9, "ai_question": "你说得很对，主动点确实很好。那你会选哪种具体的方式开口呢，比如当面打个招呼，或是写句悄悄话递过去？", "student_asr": "我会当场和他说话。", "ai_answer": "这个办法很好，当面轻轻打个招呼，既说出了自己的心意，也不会让对方觉得有压力。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860961610297077806/1788606943126.aac", "duration_s": 4, "created_at": "2026-09-05 19:15:52", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 81, "target_id": "859089600386330693", "userid": "313099440", "chatid": "859089156062683224", "textid": 7, "ai_question": "你再看看屏幕中央标注的原文里，黄帝命人拿对准蚩尤使劲擂的那件法宝，是宝剑还是大鼓呀？", "student_asr": "是大鼓", "ai_answer": "对啦，这面大鼓就是夔皮鼓，黄帝命人把它对准蚩尤连擂九下，发出像打雷一样的巨响，把蚩尤震得魂飞魄散，直接束手就擒，这神鼓的威力可真是惊人。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859089156062683224/1788160511853.aac", "duration_s": 5, "created_at": "2026-08-31 15:15:21", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 82, "target_id": "861208459973025816", "userid": "176996070", "chatid": "861208212811137032", "textid": 5, "ai_question": "你说的是它平日里最本分的差事，咱们就看今天读到的唐僧被黄袍怪变成老虎的危急时刻，白龙马还做了什么关键的事？", "student_asr": "变成龙", "ai_answer": "对，它现出了龙神真身和黄袍怪厮杀，除此之外，它之后还做了一件把整个取经团队拉回来的关键事，你还记得是什么吗？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861208212811137032/1788665682432.aac", "duration_s": 9, "created_at": "2026-09-06 11:34:57", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 83, "target_id": "861324620614340682", "userid": "284301060", "chatid": "861324557913526311", "textid": 3, "ai_question": "戏中的活无常做了什么事呢？从中能看出活无常怎样的特点？", "student_asr": "可以看出他很凄惨的特点。", "ai_answer": "你关注到了他后面受罚的惨状，那你还记得最开始，他在勾魂时对阿侄做了什么特别的决定吗？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861324557913526311/1788693382244.aac", "duration_s": 4, "created_at": "2026-09-06 19:16:32", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 84, "target_id": "859184255685771283", "userid": "212679118", "chatid": "859184112928399385", "textid": 3, "ai_question": "祥子目睹老弱车夫的惨状，却“没工夫为他们忧虑思索”——客官您来说说，他心里在想什么，为什么要刻意回避呢？", "student_asr": "因为他有一种优越感。", "ai_answer": "嗯，这层感受抓准了些。您能说说这份优越感是从哪儿来的，他想靠这个得到什么结果吗？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859184112928399385/1788183068485.aac", "duration_s": 16, "created_at": "2026-08-31 21:31:29", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 85, "target_id": "859537509892276309", "userid": "519557353", "chatid": "859537326911692819", "textid": 3, "ai_question": "哎，这场大战真是看得我连大气都不敢喘！你快来跟我讲讲，这场终极大战，结局怎么样？", "student_asr": "有极少数的幸存者，逃到了宇宙的最南端。", "ai_answer": "你说到了结局里幸存的部分，那在新世界出现之前，旧世界的天空、大地和世界之树后来怎么样了呀？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859537326911692819/1788267281326.aac", "duration_s": 27, "created_at": "2026-09-01 20:55:11", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 86, "target_id": "860534953979686974", "userid": "267517516", "chatid": "860534846483857486", "textid": 3, "ai_question": "陈莲河和前文中的“名医”有哪些相同与不同之处？请简要概括。", "student_asr": "他们的制药方术都非常的平庸，他们的，但他们，但陈联合的药更加故弄玄虚。", "ai_answer": "你已经注意到两人都在用药上玩花样，那陈莲河具体是怎么更离谱的？可以结合他开出的奇怪药方说说吗？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860534846483857486/1788505102914.aac", "duration_s": 14, "created_at": "2026-09-04 14:58:41", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 87, "target_id": "859898388085243939", "userid": "213271918", "chatid": "859898113501040708", "textid": 3, "ai_question": "少年鲁迅读《天演论》时候的状态是怎么样的呢？从中能看出少年鲁迅求学时有什么特点？", "student_asr": "嗯，少年鲁迅读这个天眼论，就是怎么说呢，如饥似渴的。即便别人是拦着他，不让他读，他也拼命拖着尖叫的读下去。可见，鲁迅却是一个勤学好问的一个孩子。小时候，然后就因为这个，也对，也为长大成为大文学家做了铺，大文豪做了铺垫。嗯，嗯，嗯嗯，从中可以，他的态度呢，是非常端正的。嗯，就是给他的态度是非常的尊重，非常的好。然后呢？可见鲁迅求学那种直觉，好问也能说是不耻下问吧？而且，是热爱魅族的。", "ai_answer": "你抓住了“如饥似渴”这个关键状态，点出他勤学好问，已经挖到了核心特征。这份对新知识的强烈渴望，正是少年鲁迅求学时最亮眼的勤奋与求知欲强的体现。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859898113501040708/1788353295341.aac", "duration_s": 52, "created_at": "2026-09-02 20:49:11", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 88, "target_id": "861248012251574361", "userid": "650903030", "chatid": "861247834232623141", "textid": 3, "ai_question": "请你按照下面的格式，说一说这两篇文章的主旨。", "student_asr": "读完这两篇文章，我发现从百草园到三味书屋，揭示了自由与与规矩的之间的矛盾。所记，展现了作者对当时教育风景的批判，以及对公平公正学习的渴望。", "ai_answer": "你已经说中了第一句的核心方向，第一句里百草园代表的是儿童天性，三味书屋代表的是旧式教育；《琐记》那边，批判的是落后教育体制，你再调整补全说说看？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861247834232623141/1788675090409.aac", "duration_s": 32, "created_at": "2026-09-06 14:12:07", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 89, "target_id": "860958631322013746", "userid": "1074708945", "chatid": "860958570684932164", "textid": 3, "ai_question": "你觉得奥西里斯的复活，靠的是什么？", "student_asr": "靠的是魔法。", "ai_answer": "神话里伊西丝确实借助了魔法的力量，但施法前她已经找了很久很久。你看第143页她找了几个月还没有停下，这表现出怎样的态度呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860958570684932164/1788606126733.aac", "duration_s": 3, "created_at": "2026-09-05 19:02:13", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 90, "target_id": "859124061739950092", "userid": "376073878", "chatid": "859123725197647886", "textid": 11, "ai_question": "悟空选择去借力，说到底是为了完成什么目标呢？", "student_asr": "为了城堡", "ai_answer": "悟空能从单打独斗变成靠借力、合作来解决问题，这本身就是成长，不是能力退步，而是解决问题的方式升级了。那你再想想，别人为什么愿意出手帮悟空呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859123725197647886/1788168724956.aac", "duration_s": 8, "created_at": "2026-08-31 17:32:18", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 91, "target_id": "859523724507078741", "userid": "215475616", "chatid": "859523581833519166", "textid": 3, "ai_question": "学校游泳的池子里淹死了人，学校是怎样处理的？", "student_asr": "这就是进去的时候，不找天平。不但天平在上面还建了一个小小的关帝庙。庙的旁边是一座印画字纸的砖炉，炉上写，炉口上方横写着四个大字，道，静溪字纸。", "ai_answer": "你准确抓到了这个最荒唐的核心细节：学校填平淹死学生的泳池，在上面造的正是这所小小的关帝庙。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859523581833519166/1788263998467.aac", "duration_s": 24, "created_at": "2026-09-01 20:00:25", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 92, "target_id": "858992409571442709", "userid": "205168078", "chatid": "858992329720176691", "textid": 3, "ai_question": "请你结合今天读到的两篇文章，说一说鲁迅提到了长妈妈的哪些事。", "student_asr": "有一些坏毛病和给他买山海经。", "ai_answer": "你提到长妈妈为小鲁迅买来《山海经》，这件事是准确的。你可以结合第21页的内容，说说长妈妈具体有哪件让小鲁迅觉得不耐烦的小事吗？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/858992329720176691/1788137344039.aac", "duration_s": 6, "created_at": "2026-08-31 08:49:09", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 93, "target_id": "860282813935644745", "userid": "347794524", "chatid": "860282749024608256", "textid": 3, "ai_question": "陈莲河和前文中的“名医”有哪些相同与不同之处？请简要概括。", "student_asr": "嗯", "ai_answer": "我们先从好入手的地方想，两人最后有没有把父亲的病治好，诊金是不是都很高呢？你可以先说说这个方向的共同点。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860282749024608256/1788444998637.aac", "duration_s": 5, "created_at": "2026-09-03 22:16:46", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 94, "target_id": "861305490905387014", "userid": "375340946", "chatid": "861305337033072663", "textid": 5, "ai_question": "你抓住了任务转变的部分，那相比在百草园可以自由玩耍，进入三味书屋后的小鲁迅，自由度怎么样，还能像以前那样自由地玩吗？", "student_asr": "不可以了，现在要认真学习。", "ai_answer": "你已经准确get到了两个核心变化：小鲁迅不能再像百草园时那样自由自在玩，只能趁先生不注意偷偷在后园待一小会儿，现在的主要任务就是读书和对课。", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861305337033072663/1788688824644.aac", "duration_s": 3, "created_at": "2026-09-06 18:00:31", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 95, "target_id": "859168520636862531", "userid": "674875153", "chatid": "859168391162900488", "textid": 3, "ai_question": "根据我们之前梳理的西游降妖策略，你认为真假猴王这一回，是靠什么方法策略解决的？为什么？", "student_asr": "借力求援，从地府打到天庭嘛，肯定就是借别人来照", "ai_answer": "借了谁的力呢？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859168391162900488/1788179319564.aac", "duration_s": 14, "created_at": "2026-08-31 20:28:57", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 96, "target_id": "861354757892292689", "userid": "328124560", "chatid": "861354132576010283", "textid": 12, "ai_question": "这句就是很真诚的赞美啦。我把你的精彩发言整理好啦，你试着参考“表达时刻”读一读，大声说出来，让山狮和大野兔都听清尺蠖成功的真正原因。", "student_asr": "小尺货能救下云端的孩子们，靠的是耐心和坚持，坚持不懈的精神。嗯，日夜不停的爬了一个月，才找到山顶的孩子们。所以，我想对小尺货说，你的，因为你的坚持不懈，所以才救下了孩子们。", "ai_answer": "读得真清楚，尺蠖成功的真正原因，也被你大声地表达出来啦！", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861354132576010283/1788700553273.aac", "duration_s": 23, "created_at": "2026-09-06 21:16:17", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 97, "target_id": "860851632827605046", "userid": "482503796", "chatid": "860851485754384411", "textid": 3, "ai_question": "鲁迅为什么反感“郭巨埋儿”的故事？", "student_asr": "那莴苣为了养莴苣的母亲，总是，总是留着给莴苣的儿子吃东西。但是，家里的食物不多了。莴苣为了母亲能吃饱饭，所以打算把自己的亲生骨肉埋了。", "ai_answer": "你把故事的情节讲出来了，不妨再回看第37页，那个还在笑着的孩子对将要发生的事全然不知情，你觉得这件事对这个孩子来说意味着什么？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860851485754384411/1788580593281.aac", "duration_s": 25, "created_at": "2026-09-05 11:57:03", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 98, "target_id": "859161858295308375", "userid": "262182076", "chatid": "859161730331303990", "textid": 5, "ai_question": "你可以试着结合原文里他出诊收费、看病的相关细节，和我说说你的想法。", "student_asr": "他只想贪财。", "ai_answer": "你抓得很准，他把出诊费抬得极高，满脑子都盯着钱。除了贪财这一点，再想想他看病的态度、治不好病之后的做法，还能看出什么特点？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/859161730331303990/1788177737352.aac", "duration_s": 9, "created_at": "2026-08-31 20:02:29", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 99, "target_id": "861187234391605273", "userid": "275034276", "chatid": "861187121753477167", "textid": 3, "ai_question": "同样的故事，用第一人称“我”来写，和用第三人称“他”来写，会有很大的不同。你觉得用第一人称写故事有什么好处？", "student_asr": "可以装十三，觉得让别人觉得自己很厉害，实则一点都没有。", "ai_answer": "这想法挺特别。咱们先看屏幕上这两句话，同样是表现害怕，读到“我”想大声叫喊时，和读到“阿克赛”想大声叫喊相比，哪一句让你离角色的内心更近、更能直接感受到他的恐惧？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/861187121753477167/1788660624339.aac", "duration_s": 8, "created_at": "2026-09-06 10:10:36", "prelabel": "疑似无噪声", "prelabel_reason": ""}, {"idx": 100, "target_id": "860881389657079864", "userid": "246469472", "chatid": "860881252830584903", "textid": 3, "ai_question": "“三落”之后的祥子，对待巡警和汽车的态度上有何转变？", "student_asr": "他对待刑警就非常的看不惯，要是刑警，巡警抓抓他的车，他也会想跟巡警打架。而对汽车，他也是开始冷漠无视。", "ai_answer": "你抓住了祥子现在硬气起来的劲儿，咱们先把巡警这部分理清楚，再说说他从前面对巡警时原本是什么样的状态呀？", "audio_url": "https://tutor-student-speaking.fbcontent.cn/speech/ai-reading/860881252830584903/1788587693989.aac", "duration_s": 20, "created_at": "2026-09-05 13:55:17", "prelabel": "疑似无噪声", "prelabel_reason": ""}];
</script>
<script>
const LS='baseline_annot_v2';
let store=JSON.parse(localStorage.getItem(LS)||'{}');
function save(){localStorage.setItem(LS,JSON.stringify(store));}
function ann(id){return store[id]||{};}
function setA(id,k,v){store[id]=store[id]||{};store[id][k]=v;save();stats();}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function stats(){
  let done=0,noise=0,affect=0;
  CASES.forEach(c=>{const a=ann(c.target_id);if(a.has_noise){done++;if(a.has_noise==='有')noise++;}if(a.affect_reply==='影响')affect++;});
  document.getElementById('m-total').textContent=CASES.length;
  document.getElementById('m-done').textContent=done;
  document.getElementById('m-noise').textContent=noise;
  document.getElementById('m-rate').textContent=done?((noise*100/done).toFixed(1)+'%'):'—';
  document.getElementById('m-affect').textContent=affect;
}
function sel(id,f,opts,cur){
  let h=`<select data-id="${id}" data-f="${f}" class="${cur?'done':''}">`;
  opts.forEach(o=>h+=`<option value="${o}" ${cur===o?'selected':''}>${o||'—'}</option>`);
  return h+'</select>';
}
function card(c,rank){
  const a=ann(c.target_id);
  const preBadge=c.prelabel==='疑似有噪声'?'<span class="badge pre-y">我预判:疑似有噪声</span>':'<span class="badge pre-n">我预判:疑似无噪声</span>';
  const preReason=c.prelabel_reason?`<div class="pre-reason"><b>预判理由:</b>${esc(c.prelabel_reason)}</div>`:'';
  return `<div class="case-card" data-id="${c.target_id}">
    <div class="case-head">
      <span class="case-rank">#${rank}</span>${preBadge}
      <span class="case-meta">chatid=${c.chatid} · ${c.duration_s}s · ${c.created_at}</span>
    </div>
    <div class="case-body">
      ${preReason}
      <div class="seg"><div class="lbl">AI 问题</div><div class="q-txt">${esc(c.ai_question)}</div></div>
      <div class="seg"><div class="lbl">学生 ASR(重点听这条音频)</div><div class="asr-txt">${esc(c.student_asr)}</div></div>
      <div class="audio-row"><audio controls preload="none" src="${c.audio_url}"></audio><span class="dur">▶ 学生录音 ${c.duration_s}秒</span></div>
      <div class="seg"><div class="lbl">AI 回答</div><div class="ai-txt">${esc(c.ai_answer)}</div></div>
    </div>
    <div class="annot-row">
      <div class="annot-field"><label>有无噪声</label>${sel(c.target_id,'has_noise',['','有','无','存疑'],a.has_noise)}</div>
      <div class="annot-field"><label>噪声类型</label>${sel(c.target_id,'noise_type',['','只有别人声音','学生+别人声音'],a.noise_type)}</div>
      <div class="annot-field"><label>是否影响AI回复</label>${sel(c.target_id,'affect_reply',['','影响','不影响'],a.affect_reply)}</div>
      <div class="annot-field"><label>AI回复是哪种</label>${sel(c.target_id,'reply_kind',['','兜底处理','回答错了','其他'],a.reply_kind)}</div>
      <div class="annot-field"><label>备注</label><textarea data-id="${c.target_id}" data-f="note" class="note ${a.note?'done':''}" placeholder="其他情况写这里">${esc(a.note||'')}</textarea></div>
    </div>
  </div>`;
}
function render(){
  const f=document.getElementById('f-status').value;
  let list=CASES.slice();
  if(f==='undone')list=list.filter(c=>!ann(c.target_id).has_noise);
  else if(f==='done')list=list.filter(c=>ann(c.target_id).has_noise);
  else if(f==='noise')list=list.filter(c=>ann(c.target_id).has_noise==='有');
  else if(f==='prey')list=list.filter(c=>c.prelabel==='疑似有噪声');
  document.getElementById('case-list').innerHTML=list.map((c,i)=>card(c,c.idx)).join('')||'<p style="padding:20px;color:#888">无</p>';
  stats();
}
document.addEventListener('change',e=>{
  const s=e.target.closest('select[data-id]');
  if(s){setA(s.dataset.id,s.dataset.f,s.value);s.classList.toggle('done',!!s.value);return;}
  if(e.target.id==='f-status')render();
});
document.addEventListener('input',e=>{
  const t=e.target.closest('textarea[data-id]');
  if(t){setA(t.dataset.id,t.dataset.f,t.value);t.classList.toggle('done',!!t.value.trim());}
});
document.getElementById('btn-json').onclick=()=>{
  const out=CASES.map(c=>({idx:c.idx,target_id:c.target_id,chatid:c.chatid,student_asr:c.student_asr,ai_question:c.ai_question,ai_answer:c.ai_answer,audio_url:c.audio_url,my_prelabel:c.prelabel,annotation:ann(c.target_id)}));
  dl(JSON.stringify(out,null,2),'基线标注结果.json','application/json');
};
document.getElementById('btn-csv').onclick=()=>{
  const hd=['idx','chatid','student_asr','我预判','有无噪声','噪声类型','影响回复','回复类型','备注','audio_url'];
  const rows=[hd.join(',')];
  CASES.forEach(c=>{const a=ann(c.target_id);
    rows.push([c.idx,c.chatid,'"'+(c.student_asr||'').replace(/"/g,'""')+'"',c.prelabel,a.has_noise||'',a.noise_type||'',a.affect_reply||'',a.reply_kind||'','"'+(a.note||'').replace(/"/g,'""')+'"',c.audio_url].join(','));});
  dl('﻿'+rows.join('\n'),'基线标注结果.csv','text/csv');
};
function dl(t,n,m){const b=new Blob([t],{type:m});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}
render();
</script>
</body>
</html>
