(function(){

function pct(v,n){ return n?(v/n*100).toFixed(1)+'%':'—'; }
function cerS(v){ return (v==null)?'—':(v*100).toFixed(1)+'%'; }

function esc(s){ return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

// delta: 数值方向。better='down' 表示越小越好(CER),='up' 表示越大越好(可用率)
function deltaHTML(bv, gv, better, isPct){
  if(bv==null||gv==null) return '<div class="delta flat">—</div>';
  var diff = gv - bv;
  var unit = isPct ? 'pp' : '';
  var shown = isPct ? (diff*100).toFixed(1) : diff.toFixed(1);
  var sign = diff>0?'+':'';
  var good = (better==='down') ? diff<0 : diff>0;
  var cls = Math.abs(diff)<1e-9 ? 'flat' : (good?'up':'down');
  var word = Math.abs(diff)<1e-9 ? '持平' : (good?'↓改善':'↑变差');
  if(better==='up') word = Math.abs(diff)<1e-9?'持平':(good?'↑提升':'↓下降');
  return '<div class="delta '+cls+'">'+word+' '+sign+shown+unit+'</div>';
}
function kpi(lb, bTxt, gTxt, bv, gv, better, isPct, warn){
  return '<div class="kpi'+(warn?' warnbox':'')+'"><div class="lb">'+lb+'</div>'
    +'<div class="duo"><span class="b">'+bTxt+'</span><span class="arrow">→</span><span class="g">'+gTxt+'</span></div>'
    +deltaHTML(bv,gv,better,isPct)+'</div>';
}

h += '<table><thead><tr><th>年级</th><th>条数</th><th>占比</th><th>完全可用率</th><th>micro CER</th><th>串音</th><th>问题案例</th></tr></thead><tbody>';

h += '</tbody></table>';
h += '<div style="height:12px"></div>';

h += '<div class="card"><h2>整体对比 <span class="mini">基线=四模型平台·线上模型(online) 200条 ｜ 优化后=灰度平台 250条 · 均为「已确认」进统计</span></h2>';
h += '<div class="desc">左灰=基线，右大=优化后。CER 越低越好，可用率越高越好。</div>';
h += '<div class="kpis">';

h += kpi('完全不可用', B.use.none+' 条', G.use.none+' 条', B.use.none/B.done, G.use.none/G.done, 'down', true);

h += '</div></div>';

h += '<div class="card"><h2>基线剔除 L7 对照 <span class="mini">基线 L7 占 36%（72/200），单独剔除看是否影响基线水位</span></h2>';

h += '<table><thead><tr><th>指标</th><th>基线·全量<br><span class="mini" style="margin:0">200 条</span></th><th>基线·剔 L7<br><span class="mini" style="margin:0">128 条</span></th><th>优化后·灰度<br><span class="mini" style="margin:0">250 条</span></th></tr></thead><tbody>';

h += row3('完全可用率', pct(B.use.full,B.done), pct(BN.use.full,BN.done), pct(G.use.full,G.done));
h += row3('可用率（完全+基本）', pct(B.use.full+B.use.basic,B.done), pct(BN.use.full+BN.use.basic,BN.done), pct(G.use.full+G.use.basic,G.done));

h += '<div class="lg">剔 L7 后基线 = L2-L6，与优化后（同为 L2-L6，无 L7）年级范围一致，这一列与优化后的年级构成更可比。但优化后各级各 50 条、更均衡，基线 L2/L3 样本很少（5/11 条），仍需注意。</div></div>';

h += '<div class="warn"><b>⚠️ 为什么「全量 CER」优化后反而更高（2.9%→8.3%）？</b><br>'

document.getElementById('APP').innerHTML = h + (window.__MORE__||'');
window.__RENDER1__ = h;

var h='';

// 可用性分布对比
function useBar(g){
  var d=g.done,u=g.use;
  return '<div class="bar2">'
    +'<i style="width:'+(u.full/d*100)+'%;background:#3a8a5f"></i>'
    +'<i style="width:'+(u.basic/d*100)+'%;background:#d19a2f"></i>'
    +'<i style="width:'+(u.none/d*100)+'%;background:#c14f45"></i></div>'
    +'<div class="lg">完全可用 '+u.full+'（'+pct(u.full,d)+'）· 基本可用 '+u.basic+'（'+pct(u.basic,d)+'）· 完全不可用 '+u.none+'（'+pct(u.none,d)+'）</div>';
}
h+='<div class="card"><h2>可用性分布</h2><div class="desc">分母=已确认条数</div>';
h+='<div style="margin-bottom:10px"><span class="tag base">基线 online</span> '+useBar(B)+'</div>';
h+='<div><span class="tag gray">优化后 灰度</span> '+useBar(G)+'</div></div>';

// CER 概览对比
h+='<div class="card"><h2>CER 概览 <span class="mini">micro=Σ错误÷Σ字数（先汇总再相除）；均值为 macro 口径仅参考</span></h2>';
h+='<table><thead><tr><th>指标</th><th>基线 online</th><th>优化后 灰度</th></tr></thead><tbody>';
var rows=[
  ['micro CER（全量）',cerS(B.microAll),cerS(G.microAll)],
  ['micro CER（剔除串音）',cerS(B.microNoCross),cerS(G.microNoCross)],
  ['CER 中位数',cerS(B.cerMed),cerS(G.cerMed)],
  ['逐条均值（macro）',cerS(B.cerMean),cerS(G.cerMean)],
  ['P90',cerS(B.cerP90),cerS(G.cerP90)],
  ['零错率',pct(B.cerZero,B.cerN),pct(G.cerZero,G.cerN)],
  ['可计算 CER 条数',B.cerN+' 条',G.cerN+' 条'],
  ['空参考（不计 CER）',B.noCer+' 条',G.noCer+' 条']
];
rows.forEach(function(r){h+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';});
h+='</tbody></table></div>';

// 问题分类对比
h+='<div class="card"><h2>问题分类分布 <span class="mini">分类为单选；子项可多选</span></h2>';
h+='<table><thead><tr><th>类别</th><th>基线 online</th><th>优化后 灰度</th></tr></thead><tbody>';
var CT={crosstalk:'串音',transcription:'转写错误',hallucination:'幻听',truncation:'截断',other:'其他'};
['crosstalk','transcription','hallucination','truncation','other'].forEach(function(k){
  h+='<tr><td>'+CT[k]+'</td><td>'+(B.cats[k]||0)+' 条 · '+pct(B.cats[k]||0,B.done)+'</td><td>'+(G.cats[k]||0)+' 条 · '+pct(G.cats[k]||0,G.done)+'</td></tr>';
});
h+='<tr><td>有问题分类合计</td><td>'+B.catCases+' 条</td><td>'+G.catCases+' 条</td></tr>';
h+='<tr><td>无问题分类</td><td>'+(B.done-B.catCases)+' 条</td><td>'+(G.done-G.catCases)+' 条</td></tr>';
h+='</tbody></table>';
h+='<div class="lg">串音来源：基线 多人声'+(B.cross.multi_speaker||0)+'/环境音'+(B.cross.ambient||0)+'；优化后 多人声'+(G.cross.multi_speaker||0)+'/环境音'+(G.cross.ambient||0)+'。'
  +'<br>串音数量增多主要是灰度批采样里含更多多人声场景，不代表模型退化——串音是环境问题，非识别错误。</div></div>';

window.__H2__=h;
document.getElementById('APP').insertAdjacentHTML('beforeend',h);
})();
</script>
<script>
(function(){
var R=window.__RESULT__,B=R.base,G=R.gray;
function pct(v,n){return n?(v/n*100).toFixed(1)+'%':'—';}
function mc(L){return L.den?(L.err/L.den*100).toFixed(1)+'%':'—';}
var h='';

// 分年级(并排):两批年级不完全一致
h+='<div class="card"><h2>分年级对比 <span class="mini">micro CER=该组Σ错误÷Σ字数</span></h2>';
h+='<div class="desc">注意：基线含 L7（72条）无 L2 仅5条；优化后 L2-L6 各50条无 L7。年级构成不同，同级可比、跨批整体需谨慎。</div>';
h+='<table><thead><tr><th>年级</th><th>批次</th><th>已确认</th><th>完全可用率</th><th>micro CER</th><th>串音</th><th>问题案例</th></tr></thead><tbody>';
var levels=['L2','L3','L4','L5','L6','L7'];
levels.forEach(function(lv){
  var Lb=B.levels[lv],Lg=G.levels[lv];
  if(Lb) h+='<tr><td rowspan="'+((Lb&&Lg)?2:1)+'">'+lv+'</td><td><span class="tag base">基线</span></td><td>'+Lb.done+'</td><td>'+pct(Lb.f,Lb.done)+'</td><td>'+mc(Lb)+'</td><td>'+Lb.cross+'</td><td>'+Lb.prob+'</td></tr>';
  if(Lg){
    var pre = Lb ? '' : '<td>'+lv+'</td>';
    h+='<tr>'+pre+'<td><span class="tag gray">优化后</span></td><td>'+Lg.done+'</td><td>'+pct(Lg.f,Lg.done)+'</td><td>'+mc(Lg)+'</td><td>'+Lg.cross+'</td><td>'+Lg.prob+'</td></tr>';
  }
});
h+='</tbody></table></div>';

// 分时长(并排)
h+='<div class="card"><h2>分时长对比 <span class="mini">时长已统一为秒</span></h2>';
h+='<table><thead><tr><th>时长</th><th>批次</th><th>已确认</th><th>完全可用率</th><th>micro CER</th><th>串音</th></tr></thead><tbody>';
for(var i=0;i<B.dur.length;i++){
  var Tb=B.dur[i],Tg=G.dur[i];
  h+='<tr><td rowspan="2">'+Tb.lab+'</td><td><span class="tag base">基线</span></td><td>'+Tb.done+'</td><td>'+pct(Tb.f,Tb.done)+'</td><td>'+(Tb.den?(Tb.err/Tb.den*100).toFixed(1)+'%':'—')+'</td><td>'+Tb.cross+'</td></tr>';
  h+='<tr><td><span class="tag gray">优化后</span></td><td>'+Tg.done+'</td><td>'+pct(Tg.f,Tg.done)+'</td><td>'+(Tg.den?(Tg.err/Tg.den*100).toFixed(1)+'%':'—')+'</td><td>'+Tg.cross+'</td></tr>';
}
h+='</tbody></table>'
  +'<div class="lg">优化后 >15s 长句占比大（108/250=43%），而长句串音/插入更集中，这也是全量 CER 被拉高的原因之一。</div></div>';

// 结论卡
h+='<div class="card"><h2>对比结论</h2><div class="note" style="margin-top:0">'
  +'① <b>可用性全面提升</b>：完全可用率 76.5%→80.4%，可用率（完全+基本）94.5%→98.0%，完全不可用 11条→5条。<br>'
  +'② <b>识别能力（剔除串音 CER）提升</b>：2.4%→1.3%，零错率 76.9%→81.1%，中位数均为 0%。这是最能反映模型识别准确性的口径。<br>'
  +'③ <b>全量 CER 反升属样本效应</b>：灰度批串音多（22 vs 6）+长句多，串音的高插入错误拉高了全量数字，不代表模型退化。<br>'
  +'④ <b>转写错误明显减少</b>：31条→17条，说明真正的「听错字」类问题在优化后下降。<br>'
  +'<b>总体判断：优化后模型在可用性与净识别准确率上均优于基线</b>，全量 CER 需结合样本构成解读。'
  +'</div></div>';

h+='<div class="foot">口径同灰度平台 computeStats：仅「已确认」进统计 · CER=(S+I+D)÷人工文本字数（只数中文/数字/字母）· micro 汇总。'
  +'<br>基线数据来自「ASR四模型标注平台」线上模型(online) · 优化后来自「ASR灰度标注平台」250条 · 生成 '+new Date().toLocaleString('zh-CN')+'</div>';

document.getElementById('APP').insertAdjacentHTML('beforeend',h);
})();
</script>
<style>
#annoBar{position:fixed;right:16px;bottom:16px;z-index:9998;display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #d0d3d9;border-radius:24px;padding:6px 10px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:12.5px}
#annoBar button{font:inherit;font-size:12.5px;padding:5px 11px;border:1px solid #d0d3d9;border-radius:18px;background:#fff;cursor:pointer}
#annoBar button.on{background:#2563eb;color:#fff;border-color:#2563eb}
#annoBar .cnt{color:#6b7280}
.anno-dot{position:absolute;width:22px;height:22px;border-radius:50%;background:#f59e0b;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:9990;transform:translate(-50%,-50%)}
.anno-pop{position:absolute;z-index:9999;background:#fff;border:1px solid #d0d3d9;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:10px;width:260px}
.anno-pop textarea{width:100%;min-height:60px;font:inherit;font-size:12.5px;border:1px solid #d0d3d9;border-radius:6px;padding:6px;resize:vertical}
.anno-pop .row{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.anno-pop button{font:inherit;font-size:12px;padding:4px 10px;border:1px solid #d0d3d9;border-radius:6px;background:#fff;cursor:pointer}
.anno-pop button.pri{background:#2563eb;color:#fff;border-color:#2563eb}
.anno-pop button.del{color:#dc2626;border-color:#fca5a5}
body.anno-adding{cursor:crosshair}
</style>
<div id="annoBar">
  <button id="annoToggle" type="button">✏️ 批注</button>
  <button id="annoAdd" type="button" style="display:none">+ 点击添加</button>
  <span class="cnt" id="annoCnt"></span>
  <button id="annoExport" type="button" style="display:none">导出</button>
  <button id="annoClear" type="button" style="display:none;color:#dc2626">清空</button>
</div>
<script>
(function(){
var LS='asr_cmp_annos_v1';
var annos=[]; try{annos=JSON.parse(localStorage.getItem(LS)||'[]')||[];}catch(e){annos=[];}
var adding=false, shown=false, seq=0;
annos.forEach(function(a){ if(a.id>seq)seq=a.id; });
var bar=document.getElementById('annoBar');
var tgl=document.getElementById('annoToggle'), addBtn=document.getElementById('annoAdd');
var cnt=document.getElementById('annoCnt'), expBtn=document.getElementById('annoExport'), clrBtn=document.getElementById('annoClear');

function save(){ try{localStorage.setItem(LS,JSON.stringify(annos));}catch(e){} updateCnt(); }
function updateCnt(){ cnt.textContent=annos.length?annos.length+' 条':''; }

function anchorEl(){ return document.getElementById('APP'); }
function place(dot,a){
  dot.style.left=(a.xr*100)+'%';
  dot.style.top=a.y+'px';
}
function renderDots(){
  document.querySelectorAll('.anno-dot,.anno-pop').forEach(function(n){n.remove();});
  if(!shown) return;
  var app=anchorEl(); var rect=app.getBoundingClientRect();
  annos.forEach(function(a,idx){
    var dot=document.createElement('div'); dot.className='anno-dot'; dot.textContent=(idx+1);
    dot.style.position='absolute';
    // 相对 APP 定位:x 用比例, y 用绝对像素(相对 APP 顶)
    dot.style.left=(app.offsetLeft + a.xr*app.offsetWidth)+'px';
    dot.style.top=(app.offsetTop + a.y)+'px';
    dot.title=a.text||'(空)';
    dot.addEventListener('click',function(ev){ ev.stopPropagation(); openPop(a,dot); });
    document.body.appendChild(dot);
  });
}
function openPop(a,dot){
  document.querySelectorAll('.anno-pop').forEach(function(n){n.remove();});
  var pop=document.createElement('div'); pop.className='anno-pop';
  pop.style.left=dot.style.left; pop.style.top=(parseFloat(dot.style.top)+16)+'px';
  pop.innerHTML='<textarea placeholder="写下批注...">'+(a.text||'')+'</textarea>'
    +'<div class="row"><button class="del">删除</button><button class="pri">保存</button></div>';
  document.body.appendChild(pop);
  var ta=pop.querySelector('textarea'); ta.focus();
  pop.querySelector('.pri').addEventListener('click',function(){ a.text=ta.value; save(); pop.remove(); renderDots(); });
  pop.querySelector('.del').addEventListener('click',function(){ annos=annos.filter(function(x){return x!==a;}); save(); pop.remove(); renderDots(); });
  pop.addEventListener('click',function(e){e.stopPropagation();});
}
tgl.addEventListener('click',function(){
  shown=!shown; tgl.classList.toggle('on',shown);
  addBtn.style.display=shown?'':'none'; expBtn.style.display=shown?'':'none'; clrBtn.style.display=shown?'':'none';
  if(!shown){ adding=false; addBtn.classList.remove('on'); document.body.classList.remove('anno-adding'); }
  renderDots(); updateCnt();
});
addBtn.addEventListener('click',function(){ adding=!adding; addBtn.classList.toggle('on',adding); document.body.classList.toggle('anno-adding',adding); });
document.addEventListener('click',function(ev){
  if(!adding) return;
  if(bar.contains(ev.target)) return;
  var app=anchorEl();
  var x=ev.pageX-app.offsetLeft, y=ev.pageY-app.offsetTop;
  var a={id:++seq, xr:x/app.offsetWidth, y:y, text:''};
  annos.push(a); save();
  adding=false; addBtn.classList.remove('on'); document.body.classList.remove('anno-adding');
  renderDots();
  setTimeout(function(){ var dots=document.querySelectorAll('.anno-dot'); openPop(a,dots[dots.length-1]); },30);
});
expBtn.addEventListener('click',function(){
  var lines=annos.map(function(a,i){return (i+1)+'. '+(a.text||'(空)');});
  var blob=new Blob([lines.join('\n')],{type:'text/plain'});
  var url=URL.createObjectURL(blob); var link=document.createElement('a');
  link.href=url; link.download='对比报告-批注.txt'; link.click();
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
});
clrBtn.addEventListener('click',function(){ if(confirm('清空所有批注?')){annos=[];save();renderDots();} });
window.addEventListener('resize',renderDots);
window.addEventListener('scroll',function(){ /* dots 用 pageY 绝对定位, 无需随滚动重算 */ });
updateCnt();
})();
</script>
</body>
