<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 阅读课 · 语音交互方案（改后）</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:#2b3548;
    background:#eef2f7; padding: 26px 18px 60px; display:flex; flex-direction:column; align-items:center;
  }
  h1 { font-size:20px; font-weight:700; margin-bottom:6px; }
  .lead { font-size:12.5px; color:#6b7488; text-align:center; max-width:680px; line-height:1.6; margin-bottom:20px; }

  .block { width:100%; max-width:1000px; margin-bottom:30px; }
  .block > h2 { font-size:16px; font-weight:700; margin-bottom:12px; padding-left:10px; border-left:4px solid #ff8a1a; }
  .schemes { display:flex; gap:22px; flex-wrap:wrap; }
  .scheme { flex:1 1 400px; background:#fff; border-radius:16px; padding:16px; box-shadow:0 8px 24px rgba(60,80,140,.1); }
  .scheme h3 { font-size:14px; font-weight:700; margin-bottom:10px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tabs button { flex:1; border:1.5px solid #e0e6f2; background:#f7f9ff; color:#6b7488;
    border-radius:9px; padding:7px 4px; font-size:12px; font-weight:600; cursor:pointer; transition:all .15s; }
  .tabs button.on { background:linear-gradient(135deg,#ff9d3c,#ff7a1a); color:#fff; border-color:transparent; }
  .stage-note { font-size:11.5px; color:#8a94a8; margin-top:10px; line-height:1.5; min-height:32px; }
  .ps { font-size:11px; color:#a3abbd; margin-top:8px; }

  /* ===== 屏幕 ===== */
  .screen { position:relative; width:100%; aspect-ratio:16/9; border-radius:13px; overflow:hidden;
    box-shadow:0 6px 18px rgba(60,80,140,.14); }
  .bg-read { background:linear-gradient(180deg,#bfe0ee,#8ec5d6 55%,#e8dcc0); }
  .bg-read .paper { position:absolute; left:22%; right:6%; top:6%; bottom:6%; background:#fdfdfa;
    border-radius:7px; box-shadow:0 5px 14px rgba(0,0,0,.12); padding:8% 6%; font-size:9px; line-height:2;
    color:#3a3128; overflow:hidden; }
  .bg-read .hl { background:#ffe1b8; border-radius:3px; padding:0 3px; }
  .bg-sea { background:linear-gradient(180deg,#3bc6d6,#66d0cf 50%,#bfe8d8); }
  .bubble-word { position:absolute; border-radius:50%;
    background:radial-gradient(circle at 40% 32%, rgba(255,255,255,.85), rgba(200,230,255,.5));
    border:2px solid rgba(255,255,255,.7); display:flex; flex-direction:column;
    align-items:center; justify-content:center; color:#2a4a8a; font-weight:700; text-align:center; }
  .bubble-word .py { font-size:7px; opacity:.8; } .bubble-word .zh { font-size:11px; }
  .fairy { position:absolute; left:1%; bottom:0; width:16%; max-width:88px; aspect-ratio:3/4;
    background: radial-gradient(circle at 50% 30%, #ffe0c4 0 22%, transparent 23%),
                radial-gradient(ellipse at 50% 88%, #9fe0a8 0 46%, transparent 47%); }
  .qbubble { position:absolute; left:16%; bottom:24%; max-width:46%;
    background:#fff; border-radius:13px 13px 13px 3px; padding:7px 11px;
    font-size:10.5px; color:#38414f; box-shadow:0 3px 10px rgba(0,0,0,.14); line-height:1.45; }
  .qbubble .add { display:block; margin-top:3px; color:#ff8a1a; font-weight:700; }

  /* ===== 外圈光 ===== */
  /* 柔和态（问完→开麦）：最淡最慢 */
  .screen.rim-soft::after {
    content:""; position:absolute; inset:0; border-radius:13px; padding:4px; pointer-events:none;
    background:linear-gradient(120deg,#ffe1b8,#ffcf9a,#ffe1b8);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:.5; animation:rimSoft 6s ease-in-out infinite;
  }
  @keyframes rimSoft { 0%,100%{opacity:.28} 50%{opacity:.5} }
  /* 常态（开麦中 / 开麦-闭麦）：暖光正常呼吸 */
  .screen.rim-on::after {
    content:""; position:absolute; inset:0; border-radius:13px; padding:5px; pointer-events:none;
    background:linear-gradient(120deg,#ffd08a,#ffb673,#ffcf9a);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    opacity:.7; animation:rimOn 4s ease-in-out infinite;
  }
  @keyframes rimOn { 0%,100%{opacity:.4} 50%{opacity:.72} }

  /* ===== 底部居中按钮（形态一） ===== */
  .done-center { position:absolute; left:50%; bottom:5%; transform:translateX(-50%);
    display:flex; align-items:center; gap:5px; border:none; cursor:pointer; color:#fff;
    font-size:12px; font-weight:700; padding:8px 20px; border-radius:999px;
    background:linear-gradient(135deg,#ff9d3c,#ff7a1a); box-shadow:0 4px 12px rgba(255,130,30,.5); white-space:nowrap; }
  .done-center .mic { font-size:12px; }

  /* ===== 右下角摄像头组件（形态二·柔和版） ===== */
  .cam { position:absolute; right:2.5%; bottom:6%; width:20%; max-width:130px; z-index:1;
    padding:6px 6px 8px; border-radius:16px; background:rgba(38,25,20,.55); backdrop-filter:blur(5px);
    display:flex; flex-direction:column; align-items:center; }
  .cam::before { content:""; position:absolute; inset:-3px; border-radius:19px; z-index:-1;
    background:linear-gradient(120deg,#ffd08a,#ffb673,#ffcf9a); filter:blur(6px); opacity:.5;
    animation:rimOn 4s ease-in-out infinite; }
  .cam.soft::before { opacity:.3; animation:rimSoft 6s ease-in-out infinite; }
  .cam .view { position:relative; width:100%; aspect-ratio:4/3; border-radius:11px; overflow:hidden;
    background:linear-gradient(155deg,#6b4a3a,#3a251c 70%,#2a1912); }
  .cam .view .wf { position:absolute; left:0; right:0; bottom:5px; display:flex; align-items:flex-end;
    justify-content:center; gap:2.5px; height:26px; }
  .cam .view .wf span { width:2.5px; border-radius:2px; background:linear-gradient(180deg,#fff,#ffd6a8);
    transform-origin:bottom; animation:wave .85s ease-in-out infinite; }
  /* 开麦阶段：波动更明显（幅度更大、更快） */
  @keyframes wave { 0%,100%{transform:scaleY(.35);opacity:.75} 50%{transform:scaleY(1.6);opacity:1} }
  /* 柔和态（问完→开麦）：单独小幅度、更慢、更淡 */
  @keyframes waveSoft { 0%,100%{transform:scaleY(.4);opacity:.5} 50%{transform:scaleY(.65);opacity:.65} }
  .cam.soft .view .wf span { animation:waveSoft 2.6s ease-in-out infinite; }
  .cam .done { position:relative; z-index:2; width:100%; border:none; cursor:pointer; color:#fff;
    font-size:10.5px; font-weight:700; padding:6px 0; border-radius:10px; margin-top:-14px;
    background:linear-gradient(135deg,#ff9d3c,#ff7a1a); box-shadow:0 3px 9px rgba(255,130,30,.5); white-space:nowrap; }
</style>
</head>
<body>
  <h1>AI 阅读课 · 语音交互方案（改后交互）</h1>
  <p class="lead">按 spec 还原两种形态 × 两个方案 × 三个阶段。点每个方案下的阶段标签查看差异。核心：问完→开麦阶段动效柔和处理；方案一靠对话框文案，方案二靠按钮文案。</p>
  <div id="root"></div>
<script>
  const wf = (n) => `<div class="wf">` + Array.from({length:n},(_,i)=>{
    const d = Math.abs(i-(n-1)/2)/((n-1)/2);
    const h = (4 + (1-d)*(1-d)*9).toFixed(0);
    return `<span style="height:${h}px;animation-delay:${(i*0.06).toFixed(2)}s"></span>`;
  }).join('') + `</div>`;

  const paper = `<div>他说到这儿，"唉——"叹了一口气，显得更加瘦了。
    <span class="hl">他是真心爱孩子们的。</span>依依和良良都觉得很过意不去，珊珊连眼圈儿也红了。</div>`;
  const bubbles = `
    <div class="bubble-word" style="left:18%;top:42%;width:20%;aspect-ratio:1"><span class="py">xiǎo qīng xiè</span><span class="zh">小青蟹</span></div>
    <div class="bubble-word" style="left:39%;top:14%;width:22%;aspect-ratio:1"><span class="py">jì jū xiè</span><span class="zh">寄居蟹</span></div>
    <div class="bubble-word" style="left:62%;top:38%;width:21%;aspect-ratio:1"><span class="py">suō zi xiè</span><span class="zh">梭子蟹</span></div>`;

  // 形态一（无摄像头）：rimClass=外圈；qAdd=气泡追加行；btn=按钮文案
  const sceneA = ({rim, qAdd='', btn='我说完啦', q}) => `
    <div class="screen bg-read ${rim}">
      <div class="paper">${paper}${paper}</div>
      <div class="fairy"></div>
      <div class="qbubble">${q}${qAdd?`<span class="add">${qAdd}</span>`:''}</div>
      <button class="done-center"><span class="mic">🎤</span>${btn}</button>
    </div>`;

  // 形态二（有摄像头）：camSoft=组件柔和；qAdd；btn=组件按钮文案
  const sceneB = ({rim, camSoft=false, qAdd='', btn='我说完啦', q}) => `
    <div class="screen bg-sea ${rim}">
      ${bubbles}
      <div class="fairy"></div>
      <div class="qbubble">${q}${qAdd?`<span class="add">${qAdd}</span>`:''}</div>
      <div class="cam ${camSoft?'soft':''}">
        <div class="view">${wf(9)}</div>
        <button class="done">${btn}</button>
      </div>
    </div>`;

  const Q_READ = '海滩上这个人，他叫什么名字？';
  const Q_SEA  = '看着屏幕气泡大声读出三种螃蟹名牌上的名字';
  const STAGE_LABELS = ['问完→开麦','开麦中','开麦→闭麦'];

  // ===== 按 spec 定义：每个 block 两个方案，每个方案三个阶段 =====
  const BLOCKS = [
    {
      title:'语音交互 · 无需摄像头',
      schemes:[
        { name:'方案一（对话框文案）', stages:[
          { scene:()=>sceneA({rim:'rim-soft', q:Q_READ, qAdd:'不着急，准备好了再说～'}),
            note:'问完→开麦：屏幕四周动效柔和处理，文案展示在对话框中【不着急，准备好了再说】' },
          { scene:()=>sceneA({rim:'rim-on', q:Q_READ}),
            note:'开麦：动效复用现状，无额外文案透传' },
          { scene:()=>sceneA({rim:'rim-on', q:Q_READ}),
            note:'开麦→闭麦：动效复用现状，无额外文案透传' },
        ]},
        { name:'方案二（按钮文案）', stages:[
          { scene:()=>sceneA({rim:'rim-soft', q:Q_READ, btn:'准备好了再说～'}),
            note:'问完→开麦：屏幕四周动效柔和处理，按钮文案展示为【准备好了再说～】' },
          { scene:()=>sceneA({rim:'rim-on', q:Q_READ, btn:'我在听'}),
            note:'开麦：动效复用现状，按钮文案展示为【我在听】' },
          { scene:()=>sceneA({rim:'rim-on', q:Q_READ, btn:'我说完啦'}),
            note:'开麦→闭麦：动效复用现状，按钮文案展示为【我说完啦】' },
        ], ps:'首次说话后，后续所有非开麦环节均定义为开麦-闭麦环节' },
      ]
    },
    {
      title:'语音交互 · 需开摄像头',
      schemes:[
        { name:'方案一（对话框文案）', stages:[
          { scene:()=>sceneB({rim:'rim-soft', camSoft:true, q:Q_SEA, qAdd:'不着急，准备好了再说～'}),
            note:'问完→开麦：迷你条和屏幕四周动效柔和处理，文案展示在对话框中【不着急，准备好了再说】' },
          { scene:()=>sceneB({rim:'rim-on', q:Q_SEA}),
            note:'开麦：动效复用现状，无额外文案透传' },
          { scene:()=>sceneB({rim:'rim-on', q:Q_SEA}),
            note:'开麦→闭麦：动效复用现状，无额外文案透传' },
        ]},
        { name:'方案二（按钮文案）', stages:[
          { scene:()=>sceneB({rim:'rim-soft', camSoft:true, q:Q_SEA, btn:'准备好了再说～'}),
            note:'问完→开麦：迷你条和屏幕四周动效柔和处理，按钮文案展示为【准备好了再说～】' },
          { scene:()=>sceneB({rim:'rim-on', q:Q_SEA, btn:'我在听'}),
            note:'开麦：动效复用现状，按钮文案展示为【我在听】' },
          { scene:()=>sceneB({rim:'rim-on', q:Q_SEA, btn:'我说完啦'}),
            note:'开麦→闭麦：动效复用现状，按钮文案展示为【我说完啦】' },
        ], ps:'首次说话后，后续所有非开麦环节均定义为开麦-闭麦环节' },
      ]
    },
  ];

  // 渲染
  const root = document.getElementById('root');
  root.innerHTML = BLOCKS.map((b,bi)=>`
    <div class="block">
      <h2>${b.title}</h2>
      <div class="schemes">
        ${b.schemes.map((s,si)=>`
          <div class="scheme">
            <h3>${s.name}</h3>
            <div class="tabs" data-b="${bi}" data-s="${si}">
              ${STAGE_LABELS.map((l,ti)=>`<button class="${ti===0?'on':''}" data-t="${ti}">${l}</button>`).join('')}
            </div>
            <div class="stage-host" id="host-${bi}-${si}"></div>
            <div class="stage-note" id="note-${bi}-${si}"></div>
            ${s.ps?`<div class="ps">ps：${s.ps}</div>`:''}
          </div>`).join('')}
      </div>
    </div>`).join('');

  function show(bi,si,ti){
    const st = BLOCKS[bi].schemes[si].stages[ti];
    document.getElementById(`host-${bi}-${si}`).innerHTML = st.scene();
    document.getElementById(`note-${bi}-${si}`).textContent = st.note;
    document.querySelectorAll(`.tabs[data-b="${bi}"][data-s="${si}"] button`)
      .forEach((btn,i)=>btn.classList.toggle('on', i===ti));
  }
  document.querySelectorAll('.tabs').forEach(tabs=>{
    const bi=+tabs.dataset.b, si=+tabs.dataset.s;
    tabs.querySelectorAll('button').forEach(btn=>
      btn.onclick=()=>show(bi,si,+btn.dataset.t));
  });
  // 初始各方案显示第一阶段
  BLOCKS.forEach((b,bi)=>b.schemes.forEach((s,si)=>show(bi,si,0)));
</script>
</body>
</html>
