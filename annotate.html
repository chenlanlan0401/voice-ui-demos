
<!-- ===== 版本条 ===== -->
<style>
#verBadge{position:fixed;top:14px;right:16px;background:#6c5ce7;color:#fff;
  font:600 12px/1 sans-serif;padding:7px 12px;border-radius:20px;cursor:pointer;z-index:9998;
  box-shadow:0 2px 8px rgba(108,92,231,.4)}
#verPanel{position:fixed;top:48px;right:16px;width:280px;background:#fff;border:1px solid #e8ebf0;
  border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:14px 16px;z-index:9998;display:none}
#verPanel h4{font:700 14px sans-serif;margin-bottom:10px;color:#1a1a2e}
.vitem{border-left:2px solid #6c5ce7;padding:0 0 12px 12px;position:relative}
.vitem:last-child{padding-bottom:0}
.vitem b{font:700 12px sans-serif;color:#6c5ce7}
.vitem .d{font:11px sans-serif;color:#8890a0;margin-left:6px}
.vitem p{font:12px/1.5 sans-serif;color:#5b6472;margin-top:2px}
/* 批注层 */
#annToggle{position:fixed;bottom:20px;right:20px;background:#1a1a2e;color:#fff;
  font:600 13px sans-serif;padding:10px 16px;border-radius:24px;cursor:pointer;z-index:9998;
  box-shadow:0 4px 16px rgba(0,0,0,.25);user-select:none}
#annToggle.on{background:#6c5ce7}
body.annmode [data-name]{cursor:crosshair}
body.annmode [data-name]:hover{outline:2px dashed #6c5ce7;outline-offset:2px}
.ann-mark{position:absolute;width:22px;height:22px;background:#e74c3c;color:#fff;
  border-radius:50%;font:700 12px sans-serif;display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:9997;box-shadow:0 2px 6px rgba(231,76,60,.5);transform:translate(-50%,-50%)}
#annEditor{position:fixed;width:260px;background:#fff;border:1px solid #6c5ce7;border-radius:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);padding:10px;z-index:9999;display:none}
#annEditor textarea{width:100%;height:64px;border:1px solid #e8ebf0;border-radius:6px;padding:6px;
  font:13px sans-serif;resize:none;outline:none}
#annEditor .hint{font:10px sans-serif;color:#8890a0;margin-top:5px}
#annPanel{position:fixed;bottom:70px;right:20px;width:280px;max-height:50vh;overflow:auto;
  background:#fff;border:1px solid #e8ebf0;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.15);
  padding:12px;z-index:9998;display:none}
#annPanel h4{font:700 13px sans-serif;margin-bottom:8px}
.annrow{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #f0f0f0;cursor:pointer}
.annrow .no{color:#e74c3c;font:700 12px sans-serif;flex-shrink:0}
.annrow .tx{font:12px/1.4 sans-serif;color:#1a1a2e;flex:1}
.annrow .nm{color:#8890a0;font-size:10px}
.annrow .del{color:#bbb;font-size:14px;flex-shrink:0}
.annrow.active{background:#f3f1ff;border-radius:6px}
#annExport{margin-top:8px;width:100%;background:#6c5ce7;color:#fff;border:none;border-radius:8px;
  padding:8px;font:600 12px sans-serif;cursor:pointer}
@keyframes annflash{0%{background:#fff3cd}100%{background:transparent}}
.annflash{animation:annflash 1.2s ease}
#annToast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#1a1a2e;
  color:#fff;font:13px sans-serif;padding:10px 18px;border-radius:24px;z-index:10000;display:none}
</style>

<div id="verBadge">版本 v1</div>
<div id="verPanel"></div>
<div id="annToggle">✏️ 批注模式</div>
<div id="annPanel"><h4>📝 批注清单</h4><div id="annList"></div>
  <button id="annExport">📋 导出给 Claude</button></div>
<div id="annEditor"><textarea id="annText" placeholder="写下你的修改意见…"></textarea>
  <div class="hint">回车保存 · Shift+回车换行 · Esc 取消(打字选字的回车不会误提交)</div></div>
<div id="annToast"></div>
