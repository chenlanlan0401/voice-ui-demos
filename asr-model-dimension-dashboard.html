<html lang="zh-CN">

<title>ASR 模型维度对照看板</title>
<style>
  :root{
    color-scheme:light;
    --ink:#19324a; --muted:#617286; --line:#d7e0e8; --soft:#f4f7fa;
    --fun:#176b87; --fun-soft:#e9f4f8;
    --qwen:#7a4bce; --qwen-soft:#f0eafb;
    --volc:#c2410c; --volc-soft:#fdeee4;
    --good:#08775b; --good-soft:#e8f7f1;
    --bad:#b42318; --bad-soft:#fff0ee;
    --shadow:0 8px 28px rgba(25,50,74,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:#eef3f7;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .topbar{padding:24px 28px 20px;color:#fff;background:linear-gradient(120deg,#14324c,#176b87);}
  .topbar h1{margin:0 0 6px;font-size:26px;letter-spacing:.02em;}
  .topbar p{margin:0;color:#d9edf4;font-size:14px;}
  .shell{width:min(1400px,calc(100% - 32px));margin:18px auto 48px;}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 2px 16px;}
  .controls .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:var(--shadow);}
  .controls .seg button{border:0;background:#fff;color:var(--muted);padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;}
  .controls .seg button+button{border-left:1px solid var(--line);}
  .controls .seg button.active{background:#176b87;color:#fff;}
  .controls .hint{color:var(--muted);font-size:12px;margin-left:auto;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 2px 18px;color:var(--muted);font-size:12px;}
  .legend .dot{display:inline-flex;align-items:center;gap:6px;}
  .legend .sw{width:12px;height:12px;border-radius:3px;display:inline-block;}
  section{margin-bottom:26px;}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;}
  .sec-head h2{margin:0;font-size:18px;}
  .sec-head .sub{color:var(--muted);font-size:12px;}
  .card{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{position:sticky;top:0;background:#f7fafc;color:var(--muted);font-weight:700;
    text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;}
  thead th.grp{text-align:left;}
  tbody td{padding:10px 12px;border-bottom:1px solid #eef2f6;text-align:right;vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  td.grp{text-align:left;font-weight:700;}
  td.grp .n{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:2px;}
  .bar-cell{min-width:150px;}
  .bar-wrap{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
  .bar-track{flex:1;height:14px;border-radius:7px;background:#eef2f6;overflow:hidden;max-width:120px;}
  .bar-fill{height:100%;border-radius:7px;}
  .val{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;}
  .best{color:var(--good);} .worst{color:var(--bad);}
  .badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:800;}
  .badge.best{background:var(--good-soft);color:var(--good);}
  .badge.worst{background:var(--bad-soft);color:var(--bad);}
  .mfun{color:var(--fun);} .mqwen{color:var(--qwen);} .mvolc{color:var(--volc);}
  .fill-fun{background:var(--fun);} .fill-qwen{background:var(--qwen);} .fill-volc{background:var(--volc);}
  .foot{color:var(--muted);font-size:12px;margin:4px 2px 0;}
  .note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:12.5px;line-height:1.7;box-shadow:var(--shadow);}
  .note b{color:var(--ink);}
  @media(max-width:720px){thead th,tbody td{padding:8px 7px;font-size:11.5px;} .bar-track{display:none;}}
</style>
</head>
<body>
<div class="topbar">

      <button data-metric="avgLat">平均尾延迟</button>
    </div>
    <span class="hint" id="metricHint"></span>
  </div>
  <div class="legend" id="legend"></div>
  <div id="sections"></div>
  <p class="foot" id="genfoot"></p>
</div>

<script>
const P = window.__PIVOT__;
const MODELS = P.models;
const TONE_CLASS = {fun:'fun', qwen:'qwen', volc:'volc'};
const toneOf = k => (MODELS.find(m=>m.key===k)||{}).tone || 'fun';

const METRIC = {
  avgCer:   {label:'平均 CER', fmt:v=>v==null?'—':(v*100).toFixed(1)+'%', lowerBetter:true,  max:null, hint:'字错率，越低越好。柱长按分组内最大值归一。'},
  winRate:  {label:'胜率',     fmt:v=>v==null?'—':(v*100).toFixed(1)+'%', lowerBetter:false, max:1,    hint:'该分组内 CER 严格最低的 case 占比；并列不计入任一方，故三家之和常小于 100%。'},
  emptyRate:{label:'空文本率', fmt:v=>v==null?'—':(v*100).toFixed(1)+'%', lowerBetter:true,  max:null, hint:'输出为空文本的占比，越低越好。'},
  avgLat:   {label:'平均尾延迟', fmt:v=>v==null?'—':Math.round(v)+'ms', lowerBetter:true, max:null, hint:'tailLatencyMs 均值，越低越快。'},
};

let curMetric = 'avgCer';

function buildLegend(){
  const el = document.getElementById('legend');
  el.innerHTML = MODELS.map(m=>{
    const t = TONE_CLASS[m.tone]||'fun';
    return `<span class="dot"><span class="sw fill-${t}"></span><b class="m${t}">${m.label}</b></span>`;
  }).join('') + `<span class="dot">🏆 深色徽标=该行最优 / 浅红=最差</span>`;
}

function rowValues(group){
  return MODELS.map(m => group.models[m.key] ? group.models[m.key][curMetric] : null);
}

function renderTable(groups, colGrp){
  const mdef = METRIC[curMetric];
  const head = `<thead><tr><th class="grp">${colGrp}</th>`
    + MODELS.map(m=>`<th>${m.label}</th>`).join('')
    + `<th>最优</th></tr></thead>`;
  const body = groups.map(g=>{
    const vals = rowValues(g);
    const nums = vals.filter(v=>v!=null);
    let best=null, worst=null;
    if(nums.length){
      best  = mdef.lowerBetter ? Math.min(...nums) : Math.max(...nums);
      worst = mdef.lowerBetter ? Math.max(...nums) : Math.min(...nums);
    }
    // bar scale
    const localMax = mdef.max!=null ? mdef.max : (nums.length?Math.max(...nums):1);
    const bestIdx = vals.findIndex(v=>v!=null && v===best);
    const bestModel = bestIdx>=0 ? MODELS[bestIdx].label : '—';
    const cells = MODELS.map((m,i)=>{
      const v = vals[i];
      const t = TONE_CLASS[m.tone]||'fun';
      const pct = (v==null||localMax===0)?0:Math.max(2,Math.min(100,(v/localMax)*100));
      let cls='';
      if(nums.length>1){ if(v===best) cls='best'; else if(v===worst) cls='worst'; }
      return `<td class="bar-cell"><div class="bar-wrap">`
        + `<span class="bar-track"><span class="bar-fill fill-${t}" style="width:${pct}%"></span></span>`
        + `<span class="val ${cls}">${mdef.fmt(v)}</span></div></td>`;
    }).join('');
    return `<tr><td class="grp">${g.label}<span class="n">n=${g.n}</span></td>${cells}`
      + `<td><span class="badge best">${bestModel}</span></td></tr>`;
  }).join('');
  return `<div class="card"><table>${head}<tbody>${body}</tbody></table></div>`;
}

function section(title, sub, groups, colGrp){
  return `<section><div class="sec-head"><h2>${title}</h2><span class="sub">${sub}</span></div>`
    + renderTable(groups, colGrp) + `</section>`;
}

function render(){
  const mdef = METRIC[curMetric];
  document.getElementById('metricHint').textContent = mdef.hint;
  const html = [
    section('总体', `全部 ${P.totalCases} 条 case`, [Object.assign({label:'全部 case'}, P.overall)], '范围'),
    section('按可用性', '人工标注的音频可用性', P.availability, '可用性'),
    section('按问题类型', '人工标注的疑难 case 类别', P.category, '问题类型'),
    section('按音频时长', '按录音时长分桶', P.duration, '时长区间'),
  ].join('');
  document.getElementById('sections').innerHTML = html;
}

document.getElementById('metricSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  curMetric = b.dataset.metric;
  [...e.currentTarget.querySelectorAll('button')].forEach(x=>x.classList.toggle('active', x===b));
  render();
});

buildLegend();
render();
document.getElementById('genfoot').textContent =
  '数据生成时间 ' + (P.generatedAt||'') + ' · 共 ' + P.totalCases + ' 条 case · 模型：' + MODELS.map(m=>m.label).join(' / ');
</script>
</body>
</html>
